[package]
name = "shui"
version = "0.1.0-rc.11"
edition = "2024"
build = "scripts/build.rs"
license = "GPL-3.0-only"
description = "Shui (Shell UI): a fast SSH and Mosh connection picker built with Ratatui"

[build-dependencies]
serde_yaml_ng = "0.10.0"

[dependencies]
base64 = "0.22"
glob = "0.3"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tui-markdown = { version = "0.3.11", default-features = false }
crossterm = "0.29.0"
shell-words = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
