# $XDG_CONFIG_HOME/shui.yml (default: ~/.config/shui.yml)
# F9 edits this file and validates/reloads it after saving. Existing files are
# never overwritten on upgrade; merge desired profiles/recipes from the defaults.
# Commands and scripts are trusted shell code. Checks and generators run locally.
#
# Profile fields: name (unique), command (required), key, available_command,
# prepare_command, prepare_remote, usage_command, inputs, shell, prepare_shell, port_args, and string
# fields referenced by %{field}. Windows overrides use direct commands/PowerShell.
# Inputs: promptString for text, pickString for one choice, checkbox for independent
# options (default: true/false; Space toggles; templates receive true/false).
# default names a profile. Left/Right changes only the selected host's profile.
#
# Templates: %h = user@host; %p = explicit port or empty; %t = user@host[:port];
# %{field} = another string field; %{input:id} = dialog value; %% = literal %.
# Substitutions are shell-escaped: leave placeholders UNQUOTED. A remote command
# needs a quoting layer at each shell boundary; see remote/script fields below.
# Fields without %{...} references stay literal (including shell expressions).
# Optional-port templates preserve SSH alias settings when no port was entered.
#
# Profile key: Ctrl+, Alt+, or Ctrl+Alt+ plus A-Z. Plain text remains filter input.
# Keys must not duplicate another profile or a menu action, even if unavailable.
# Ctrl+H/I/J/M/S/Z are reserved for terminal aliases and flow/suspend behavior.
# Setup recipes cannot define keys. Ctrl+Q has no built-in action.
#
# available_command: quick, noninteractive local sh -c check, without placeholders.
# Exit 0 keeps the entry; other statuses hide it. Profile checks run at load/reload;
# setup checks run when F4 opens. No check means always available. Output is ignored.
# Checks time out after five seconds; input generators have the same timeout
# and a 64 KiB limit on each output stream. They have no controlling terminal
# on Unix, so prompts cannot interfere with the menu.
# These checks do not test remote connectivity or remote tool availability.
# Shipped profiles launch their named tool; Zellij can use a verified temporary download.
# prepare_command runs locally with the terminal restored, before setup/connect/history.
# Exit 0 continues; any failure/cancellation returns to the menu. It supports %h,
# %p, %t and named fields, but not dialog inputs. It is only for launch profiles.
# prepare_remote runs before %{remote} in the same remote shell. History contains
# only the command for an already prepared host. A custom local script can supply
# a single-line usage_command (literal client arguments) for Bash history.
default: SSH
# auto: show usernames only to distinguish accounts for the same host/port.
# always: show known usernames; never: hide the username column.
# This affects display only. Matching configured usernames are omitted in commands.
username_display: auto
# Omitted keybindings use the built-in defaults. See config.optional.yml for
# editable bindings and custom profiles/recipes, all tested as active YAML.

profiles:
  - name: SSH
    shell: direct
    available_command: sh -c 'command -v ssh'
    key: Alt+S
    command: ssh -- %h
    port_args: [-p, '%p']
  - name: Mosh
    shell: direct
    available_command: sh -c 'command -v ssh && command -v mosh'
    key: Alt+M
    command: mosh -- %h
    port_args: ['--ssh=ssh -p %p']
  - name: MC
    shell: direct
    available_command: sh -c 'command -v ssh && command -v mc'
    key: Alt+C
    command: mc /sh://%t/
  - name: Bash
    shell: direct
    available_command: sh -c 'command -v ssh'
    key: Alt+B
    command: ssh -tt -- %h %{remote}
    port_args: [-p, '%p']
    remote: exec bash -l
  - name: Zellij
    shell: direct
    available_command: sh -c 'command -v ssh'
    key: Alt+Z
    command: ssh -tt -- %h %{remote}
    port_args: [-p, '%p']
    remote: zellij attach --create options --show-startup-tips false --show-release-notes false
    prepare_remote: |
      set -u
      if ! command -v zellij >/dev/null 2>&1; then
        zellij_bin=$HOME/.local/bin/zellij
        if [ ! -x "$zellij_bin" ]; then
          fail() { printf 'shui: %s\n' "$*" >&2; exit 1; }
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64)
              platform=x86_64-unknown-linux-musl
              expected=d006c521dcb475a6005d741e9dd7c5758e5a23b28dd60a5c10cebfa4876319dd ;;
            Linux:aarch64|Linux:arm64)
              platform=aarch64-unknown-linux-musl
              expected=2a2c0621e6f3b11ecbb05d66939a48000a2508604620aa20727a5fd61c49f451 ;;
            *) fail 'Install Zellij in your user profile on this platform; portable downloads support Linux x86-64/ARM64.' ;;
          esac
          umask 077
          work=$(mktemp -d "${TMPDIR:-/tmp}/shui-zellij.XXXXXX")
          trap 'rm -rf -- "$work"' 0
          trap 'exit 1' HUP INT TERM
          url=https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-$platform.tar.gz
          printf 'Downloading temporary Zellij 0.45.1...\n' >&2
          if command -v curl >/dev/null 2>&1; then
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location \
              --retry 2 --connect-timeout 15 --max-time 180 --silent --show-error \
              --output "$work/zellij.tar.gz" "$url" || fail 'Zellij download failed'
          else
            wget --https-only --timeout=30 --tries=2 -q -O "$work/zellij.tar.gz" "$url" || fail 'Zellij download failed'
          fi
          tar -xzf "$work/zellij.tar.gz" -C "$work" zellij || fail 'Cannot extract Zellij'
          [ -f "$work/zellij" ] && [ ! -L "$work/zellij" ] || fail 'Invalid Zellij archive member'
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "$work/zellij")
          else
            digest=$(shasum -a 256 "$work/zellij")
          fi
          [ "${digest%% *}" = "$expected" ] || fail 'Zellij checksum mismatch; refusing to execute it'
          chmod 700 "$work/zellij"
          zellij_bin=$work/zellij
        fi
        zellij() { "$zellij_bin" "$@"; }
      fi

  # Persistent sessions, file transfers, monitoring and SSH forwarding.
  - name: Tmux
    shell: direct
    available_command: sh -c 'command -v ssh'
    key: Alt+T
    command: ssh -tt -- %h %{remote}
    port_args: [-p, '%p']
    remote: tmux attach-session || exec tmux new-session
  - name: SFTP
    shell: direct
    available_command: sh -c 'command -v sftp'
    key: Alt+F
    command: sftp -- %h
    port_args: [-P, '%p']
  - name: Monitor
    shell: direct
    available_command: sh -c 'command -v ssh'
    key: Alt+H
    command: ssh -tt -- %h %{remote}
    port_args: [-p, '%p']
    remote: exec btop
  - name: Tunnel
    available_command: command -v ssh
    key: Ctrl+Alt+L
    inputs:
      - id: forward
        type: promptString
        description: Forward (8080:localhost:80; IPv6 host in brackets)
        pattern: '(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]):(?:[A-Za-z0-9_.-]+|\[[0-9A-Fa-f:]+\]):(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])'
        validation_message: Use local-port:host:remote-port; ports must be 1-65535
        default: '8080:localhost:80'
        required: true
    # The destination is reached from the SSH server; listen only on loopback.
    command: |
      port=%p
      forward=%{input:forward}
      printf 'Forwarding 127.0.0.1:%s through SSH. Ctrl+C stops the tunnel.\n' "$forward"
      exec ssh ${port:+-p "$port"} -N -T -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -L "127.0.0.1:$forward" -- %h
  - name: SOCKS
    available_command: command -v ssh
    key: Ctrl+Alt+D
    inputs:
      - id: port
        type: promptString
        description: Local SOCKS port (1-65535)
        pattern: '(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])'
        validation_message: Enter a port number from 1 to 65535
        default: '1080'
        required: true
    command: |
      port=%p
      listen=%{input:port}
      printf 'SOCKS proxy on 127.0.0.1:%s. Ctrl+C stops the proxy.\n' "$listen"
      exec ssh ${port:+-p "$port"} -N -T -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -D "127.0.0.1:$listen" -- %h

  # Alternative clients use their own settings, not OpenSSH's ~/.ssh/config.
  # Use a real hostname/address (or a PuTTY saved session) and explicit user/port.
  - name: Dropbear
    key: Alt+D
    shell: direct
    available_command: sh -c 'command -v dbclient'
    command: dbclient -- %h
    port_args: [-p, '%p']

# F4 configures the selected host; Shift+F4 opens Add new to add and connect.
# You can also switch between these modes using the Action field.
# Configure host runs setup and returns to the menu without saving history.
# Space toggles recipe checkboxes. All checked recipes show their inputs together.
# Enter runs checked recipes in config order, stopping on failure.
# None is selected by default; a recipe is required only in Configure host mode.
# Same command templates and named fields as launch profiles; runs locally.
configuration_scripts:
  - name: Configure key-based auth
    inputs:
      - &ssh_key
        id: key
        type: pickString
        description: SSH keypair
        required: true
        # Emit YAML. Only list public keys with a matching private-key file.
        command: |
          printf 'options:\n'
          for public in "$HOME"/.ssh/id_*.pub; do
            [ -f "$public" ] && [ -f "${public%.pub}" ] || continue
            name=${public##*/}
            escaped=$(printf '%s' "$name" | sed "s/'/''/g")
            printf "  - '%s'\n" "$escaped"
          done
          printf "  - 'Generate new Ed25519 key'\n"
      - id: new_key
        type: promptString
        description: New key filename in ~/.ssh (generation only)
        default: id_ed25519
        required: true
        pattern: '[A-Za-z0-9][A-Za-z0-9_.-]*'
        validation_message: Use a filename without slashes; choose an unused name
      - &ssh_key_expiry
        id: expiry
        type: pickString
        description: Key expiry
        options: [never, 8 hours, day, week, month, year]
        default: never
        # Durations start on the server after key installation: month = 30 days,
        # year = 365 days. UTC avoids local time-zone / daylight-saving ambiguity.
        # never removes expiry-time from this key; it does not remove other options.
    command: sh -c %{setup_script} -- %h %p %{prepare_key} %{input:key} %{expiry_remote} %{input:new_key} %{install_key_remote}
    setup_script: |
      set -eu
      host=$1
      port=$2
      key=$(sh -c "$3" -- "$4" "$6")
      ssh ${port:+-p "$port"} -- "$host" "$7" < "$key"
      ssh ${port:+-p "$port"} -i "${key%.pub}" -- "$host" "$5" < "$key"
    install_key_remote: sh -c %{install_key}
    install_key: |
      set -eu
      umask 077
      mkdir -p "$HOME/.ssh"
      file="$HOME/.ssh/authorized_keys"
      test ! -L "$file" || { echo 'Refusing symlinked authorized_keys.' >&2; exit 1; }
      test ! -e "$file" || test -f "$file" || exit 1
      IFS= read -r key || test -n "$key"
      key=$(printf '%s' "$key" | tr -d '\r')
      fingerprint=$(printf '%s\n' "$key" | ssh-keygen -lf - | awk '{print $2}')
      test -n "$fingerprint" || { echo 'Invalid public key.' >&2; exit 1; }
      # Check key identity, not whether some other configured key can log in.
      if test -s "$file" && ssh-keygen -lf "$file" | awk -v key="$fingerprint" '$2 == key {found=1} END {exit !found}'; then
        exit 0
      fi
      printf '\n%s\n' "$key" >> "$file"
      chmod 600 "$file"
    expiry_remote: &ssh_key_expiry_remote sh -c %{set_expiry} -- %{input:expiry}
    # Update every occurrence of the selected key in the standard authorized_keys.
    # Preserve other keys, comments, and options (including quoted commas/spaces).
    # Custom AuthorizedKeysFile/Command layouts need a custom recipe.
    set_expiry: &set_ssh_key_expiry |
      set -eu
      case "$1" in
        never) seconds=0 ;;
        '8 hours') seconds=28800 ;;
        day) seconds=86400 ;;
        week) seconds=604800 ;;
        month) seconds=2592000 ;;
        year) seconds=31536000 ;;
        *) echo 'Unknown key expiry.' >&2; exit 1 ;;
      esac
      expiry=
      if [ "$seconds" -ne 0 ]; then
        deadline=$(( $(date +%s) + seconds ))
        expiry=$(date -u -d "@$deadline" +%Y%m%d%H%M%SZ 2>/dev/null) ||
          expiry=$(date -u -r "$deadline" +%Y%m%d%H%M%SZ)
      fi
      read -r key_type key_blob _comment || :
      [ -n "$key_type" ] && [ -n "$key_blob" ] || exit 1
      file="$HOME/.ssh/authorized_keys"
      [ -f "$file" ] && [ ! -L "$file" ] || {
        echo 'Expected a regular ~/.ssh/authorized_keys file.' >&2; exit 1;
      }
      umask 077
      work=$(mktemp -d "$HOME/.ssh/.shui-expiry.XXXXXX")
      trap 'rm -rf "$work"' 0
      trap 'exit 1' HUP INT TERM
      cp "$file" "$work/original"
      awk -v key_type="$key_type" -v key_blob="$key_blob" -v expiry="$expiry" '
        # Find a separator outside double quotes, respecting backslash escapes.
        function boundary(s, commas,    i,c,quoted,escaped) {
          for (i=1; i<=length(s); i++) {
            c=substr(s,i,1)
            if (escaped) { escaped=0; continue }
            if (c=="\\") { escaped=1; continue }
            if (c=="\"") { quoted=!quoted; continue }
            if (!quoted && (commas ? c=="," : c ~ /[ \t]/)) return i
          }
          return length(s)+1
        }
        function token(    n,t) {
          sub(/^[ \t]+/, "", rest)
          n=boundary(rest,0); t=substr(rest,1,n-1)
          rest=substr(rest,n); return t
        }
        /^[ \t]*(#|$)/ { print; next }
        {
          original=$0; rest=$0; options=""; kind=token()
          if (kind!=key_type) { options=kind; kind=token() }
          blob=token()
          if (kind!=key_type || blob!=key_blob) { print original; next }
          found=1; kept=""
          while (length(options)) {
            n=boundary(options,1); option=substr(options,1,n-1)
            options=substr(options,n+1)
            if (option !~ /^expiry-time=/)
              kept=kept (length(kept) ? "," : "") option
          }
          if (length(expiry)) kept=kept (length(kept) ? "," : "") "expiry-time=\"" expiry "\""
          print (length(kept) ? kept " " : "") kind " " blob rest
        }
        END { if (!found) exit 1 }
      ' "$work/original" > "$work/updated" || {
        echo 'Could not find the installed key in ~/.ssh/authorized_keys.' >&2; exit 1;
      }
      cmp -s "$file" "$work/original" || {
        echo 'authorized_keys changed during setup; retry.' >&2; exit 1;
      }
      chmod 600 "$work/updated"
      mv "$work/updated" "$file"
      printf 'Key expiry: %s%s\n' "$1" "${expiry:+ ($expiry UTC)}"
    # Only runs after confirming setup, with the terminal restored for prompts.
    prepare_key: &prepare_ssh_key |
      set -eu
      if [ "$1" = 'Generate new Ed25519 key' ]; then
        case "$2" in ''|*[!a-zA-Z0-9_.-]*|.*) echo 'Invalid new key filename.' >&2; exit 1 ;; esac
        private="$HOME/.ssh/$2"
        for file in "$private" "$private.pub"; do
          if [ -e "$file" ] || [ -L "$file" ]; then
            echo "Cannot generate a new key: $file already exists. Choose an unused New key filename." >&2
            exit 1
          fi
        done
        umask 077
        mkdir -p "$HOME/.ssh"
        echo "Generating $private (ssh-keygen will ask for a passphrase)." >&2
        ssh-keygen -q -t ed25519 -f "$private" >&2
        public="$private.pub"
      else
        public="$HOME/.ssh/$1"
      fi
      [ -f "$public" ] && [ -f "${public%.pub}" ] || {
        echo "Missing SSH keypair: $public" >&2
        exit 1
      }
      printf '%s\n' "$public"
  - name: Install dotfiles
    packages: &install_packages |
      set -eu
      [ "$#" -gt 0 ] || exit 0
      . /etc/os-release
      case " $ID ${ID_LIKE:-} " in
        *' debian '*|*' ubuntu '*)
          [ -n "${VERSION_CODENAME:-}" ] || { echo 'Cannot verify the installed release; install the missing dependencies manually.' >&2; exit 1; }
          apt-get update
          indexes=$(apt-get indextargets --format "\$(ORIGIN)|\$(CODENAME)")
          [ -n "$indexes" ] || { echo 'No repository release metadata; refusing package installation.' >&2; exit 1; }
          printf '%s\n' "$indexes" | while IFS='|' read -r origin codename; do
            case "$origin" in
              Debian*|Ubuntu*)
                case "$codename" in "$VERSION_CODENAME"|"$VERSION_CODENAME"-*) ;;
                  *) echo "Repository release $codename does not match installed $VERSION_CODENAME; fix repositories manually." >&2; exit 1 ;;
                esac ;;
            esac
          done
          DEBIAN_FRONTEND=noninteractive apt-get install --no-upgrade --no-remove --no-install-recommends -y "$@" ;;
        *' fedora '*|*' rhel '*|*' rocky '*) dnf --setopt=install_weak_deps=False install -y "$@" ;;
        *' suse '*|*' opensuse-tumbleweed '*) zypper --non-interactive install --no-recommends "$@" ;;
        *' arch '*) pacman -S --needed --noconfirm "$@" ;;
        *' alpine '*) apk add "$@" ;;
        *) echo "Unsupported dependency installer for $ID; install dependencies manually." >&2; exit 1 ;;
      esac
    # Relative source paths are resolved under local $HOME.
    inputs:
      - id: source
        type: promptString
        description: Local directory (absolute or relative to home)
        default: ~/src/dotfiles
        required: true
      - id: installer
        type: promptString
        description: Installer path relative to dotfiles directory
        default: install.sh
        required: true
      - id: shell
        type: pickString
        description: Installer shell
        options: [sh, bash]
        default: sh
    command: sh -c %{setup_script} -- %h %p %{input:source} %{input:installer} %{remote}
    setup_script: |
      set -eu
      host=$1
      port=$2
      source=$3
      installer=$4
      case "$source" in '~') source=$HOME ;; '~/'*) source="$HOME/${source#\~/}" ;; /*) ;; *) source="$HOME/$source" ;; esac
      test -f "$source/$installer" || { echo "Missing $source/$installer" >&2; exit 1; }
      archive=$(mktemp "${TMPDIR:-/tmp}/shui-dotfiles.XXXXXX")
      trap 'rm -f "$archive"' 0
      trap 'exit 1' HUP INT TERM
      tar -cf "$archive" -C "$source" .
      ssh ${port:+-p "$port"} -- "$host" 'set -eu; mkdir -p "$HOME/src/dotfiles"; tar -xf - -C "$HOME/src/dotfiles"' < "$archive"
      ssh ${port:+-p "$port"} -tt -- "$host" "$5"
    remote: sh -c %{script} -- %{input:installer} %{input:shell} %{packages}
    script: |
      set -eu
      if ! command -v "$2" >/dev/null; then
        case "$2" in bash) ;; *) echo 'Unsupported installer shell.' >&2; exit 1 ;; esac
        root() { if [ "$(id -u)" = 0 ]; then "$@"; else sudo "$@"; fi; }
        root sh -c "$3" -- bash
      fi
      cd "$HOME/src/dotfiles"
      exec "$2" "./$1"
  - name: Configure passwordless sudo
    packages: *install_packages
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{elevate} -- %{script} %{install_sudo} %{packages} %{input:scope} %{input:account}
    inputs:
      - {id: scope, type: pickString, description: 'Grant passwordless sudo to (other rules unchanged)', options: [Selected user, Administrative group], default: Selected user}
      - {id: account, type: promptString, description: 'User name (blank = SSH login; ignored for group scope)', default: '', pattern: '[a-zA-Z_][a-zA-Z0-9_-]*', validation_message: Enter a local login name}
    elevate: &recipe_elevate |
      set -eu
      script=$1
      shift
      if [ "$(id -u)" = 0 ]; then
        exec sh -c "$script" -- "$@"
      fi
      exec sudo sh -c "$script" -- "$@"
    install_sudo: &install_sudo |
      set -eu
      if command -v sudo >/dev/null && command -v visudo >/dev/null; then exit 0; fi
      sh -c "$1" -- sudo
    script: |
      set -eu
      installer=$1 packages=$2 scope=$3 account=$4
      case "$scope" in
        'Selected user')
          account=${account:-${SUDO_USER:-$(id -un)}}
          case "$account" in ''|*[!a-zA-Z0-9_-]*) echo 'Invalid sudo user.' >&2; exit 1 ;; esac
          id "$account" >/dev/null
          subject=$account
          fragment=/etc/sudoers.d/shui-nopasswd-user-$account ;;
        'Administrative group')
          . /etc/os-release
          case " $ID ${ID_LIKE:-} " in
            *' debian '*|*' ubuntu '*) group=sudo ;;
            *' fedora '*|*' rhel '*|*' rocky '*|*' alpine '*|*' arch '*|*' suse '*|*' opensuse-tumbleweed '*) group=wheel ;;
            *) echo "Unsupported administrative group for $ID" >&2; exit 1 ;;
          esac
          subject=%$group
          fragment=/etc/sudoers.d/shui-nopasswd-group-$group ;;
        *) echo 'Invalid sudo scope.' >&2; exit 1 ;;
      esac
      sh -c "$installer" -- "$packages"
      if [ "$scope" = 'Administrative group' ] && ! getent group "$group" >/dev/null; then
        if command -v groupadd >/dev/null; then groupadd "$group"; else addgroup -S "$group"; fi
      fi
      mkdir -p /etc/sudoers.d
      work=$(mktemp -d /etc/sudoers.d/.shui-nopasswd.XXXXXX)
      trap 'rm -rf "$work"' 0
      trap 'exit 1' HUP INT TERM
      printf '%s ALL=(ALL:ALL) NOPASSWD: ALL\n' "$subject" > "$work/nopasswd"
      chmod 0440 "$work/nopasswd"
      visudo -cf "$work/nopasswd"
      test ! -L "$fragment" || {
        echo "Refusing symlinked $fragment" >&2; exit 1;
      }
      if [ -f "$fragment" ]; then
        cp -p "$fragment" "$work/original"
      fi
      mv "$work/nopasswd" "$fragment"
      if ! visudo -c; then
        if [ -f "$work/original" ]; then
          mv "$work/original" "$fragment"
        else
          rm -f "$fragment"
        fi
        exit 1
      fi
      printf 'Passwordless sudo configured for %s.\n' "$subject"
  - name: Configure SSH-agent sudo
    packages: *install_packages
    install_sudo: *install_sudo
    command: port=%p; exec ssh ${port:+-p "$port"} -A -tt -- %h %{remote}
    remote: sh -c %{prepare} -- %{script} %{install_sudo} %{packages}
    prepare: |
      set -eu
      keys=$(ssh-add -L)
      user=$(id -un)
      if [ "$(id -u)" = 0 ]; then
        exec sh -c "$1" -- "$user" "$keys" "$2" "$3"
      fi
      exec sudo sh -c "$1" -- "$user" "$keys" "$2" "$3"
    script: |
      set -eu
      user=$1
      keys=$2
      case "$user" in ''|*[!a-zA-Z0-9_-]*) echo 'Unsupported login username.' >&2; exit 1 ;; esac
      sh -c "$3" -- "$4"
      . /etc/os-release
      module=
      find_module() {
        for path in /usr/lib/security/pam_ssh_agent_auth.so /usr/lib64/security/pam_ssh_agent_auth.so /lib/security/pam_ssh_agent_auth.so /lib64/security/pam_ssh_agent_auth.so /usr/lib/*-linux-gnu/security/pam_ssh_agent_auth.so /lib/*-linux-gnu/security/pam_ssh_agent_auth.so; do
          if [ -f "$path" ]; then module=$path; return 0; fi
        done
        return 1
      }
      if ! find_module; then
        case " $ID ${ID_LIKE:-} " in
          *' debian '*|*' ubuntu '*)
            sh -c "$4" -- libpam-ssh-agent-auth ;;
          *' fedora '*|*' rhel '*|*' rocky '*|*' suse '*|*' opensuse-tumbleweed '*) sh -c "$4" -- pam_ssh_agent_auth ;;
          *' arch '*|*' alpine '*) sh -c "$4" -- pam-ssh-agent-auth ;;
          *) echo "No supported package installer for $ID" >&2; exit 1 ;;
        esac
        find_module || { echo 'pam_ssh_agent_auth is not available from the enabled repositories.' >&2; exit 1; }
      fi
      test -f /etc/pam.d/sudo || test -f /usr/lib/pam.d/sudo || { echo 'A PAM-enabled sudo installation is required.' >&2; exit 1; }
      # Keep keys root-owned, independent of the user's SSH login authorized_keys.
      directory=/etc/security/ssh-agent-sudo
      test ! -L "$directory" || { echo 'Refusing symlinked key directory.' >&2; exit 1; }
      mkdir -p "$directory" /etc/sudoers.d /etc/pam.d
      chmod 0755 "$directory"
      work=$(mktemp -d "$directory/.setup.XXXXXX")
      trap 'rm -rf "$work"' 0
      trap 'exit 1' HUP INT TERM
      printf '%s\n' "$keys" > "$work/keys"
      chmod 0644 "$work/keys"
      # PAM must authenticate the invoking user, including on distros whose
      # default sudo policy requests the target user's (usually root) password.
      printf 'Defaults:%s env_keep += "SSH_AUTH_SOCK"\nDefaults:%s !targetpw, !rootpw, !runaspw\n' "$user" "$user" > "$work/sudoers"
      chmod 0440 "$work/sudoers"
      visudo -cf "$work/sudoers"
      for file in /etc/pam.d/sudo /etc/pam.d/sudo-i; do
        name=${file##*/}
        source=$file
        if [ ! -e "$source" ] && [ ! -L "$source" ]; then source=/usr/lib/pam.d/$name; fi
        [ -e "$source" ] || continue
        test -f "$source" && test ! -L "$source" || {
          echo "Refusing non-regular PAM file: $file" >&2; exit 1;
        }
        cp -p "$source" "$work/$name.original"
        {
          printf 'auth sufficient %s file=/etc/security/ssh-agent-sudo/%%u # shui-agent-sudo\n' "$module"
          sed '/# shui-agent-sudo$/d' "$source"
        } > "$work/$name"
        chmod 0644 "$work/$name"
      done
      fragment=/etc/sudoers.d/ssh-agent-auth-$user
      test ! -L "$directory/$user" && test ! -L "$fragment" || {
        echo 'Refusing symlinked agent-auth configuration.' >&2; exit 1;
      }
      if [ -f "$fragment" ]; then
        cp -p "$fragment" "$work/sudoers.original"
      fi
      mv "$work/sudoers" "$fragment"
      if ! visudo -c; then
        if [ -f "$work/sudoers.original" ]; then
          mv "$work/sudoers.original" "$fragment"
        else
          rm -f "$fragment"
        fi
        exit 1
      fi
      mv "$work/keys" "$directory/$user"
      for name in sudo sudo-i; do
        [ -f "$work/$name" ] || continue
        if [ ! -e "/etc/pam.d/$name.shui-backup" ] && [ ! -L "/etc/pam.d/$name.shui-backup" ]; then
          cp -p "$work/$name.original" "/etc/pam.d/$name.shui-backup"
        fi
        mv "$work/$name" "/etc/pam.d/$name"
      done
      printf 'SSH-agent sudo configured for %s. Use agent forwarding on future connections.\n' "$user"
  - name: Configure automatic security updates
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{elevate} -- %{traverse} %{script} %{traverse} %{input:reboot} 3
    inputs:
      - {id: reboot, type: checkbox, description: 'Native auto reboot when required, where supported (disconnects sessions)', default: false}
    elevate: *recipe_elevate
    traverse: |
      set -eu
      script=$1 self=$2 reboot=$3 depth=$4
      warn() { echo "WARNING: $*. Update affected systems manually." >&2; }
      failures=0
      if ! sh -c "$script" -- "$reboot"; then failures=1; fi
      if [ "$depth" -eq 0 ]; then
        warn 'Nested guest traversal depth limit reached'
        exit "$failures"
      fi
      # Never install transport helpers; each child invocation is bounded.
      command -v timeout >/dev/null || { warn 'No timeout utility; guest traversal skipped'; exit "$failures"; }
      depth=$((depth - 1))
      count=0
      slot() {
        count=$((count + 1))
        if [ "$count" -gt 16 ]; then warn '16-guest limit on this host reached'; return 1; fi
      }
      if command -v docker >/dev/null; then
        if containers=$(timeout 15 docker ps -q --no-trunc); then
          for container in $containers; do
            slot || break
            echo "Docker $container:"
            if ! timeout 15 docker exec --user 0 "$container" /bin/sh -c ':'; then warn "Docker $container has no accessible shell"; continue; fi
            if ! timeout 120 docker exec --user 0 "$container" /bin/sh -c "$self" -- "$script" "$self" "$reboot" "$depth"; then
              warn "Docker $container could not be fully configured (it may lack a shell, permissions or a scheduler)"
              failures=1
            fi
          done
        else warn 'Docker inventory unavailable'; fi
      fi
      if command -v virsh >/dev/null; then
        for uri in lxc:/// qemu:///system; do
          if ! domains=$(timeout 15 virsh -c "$uri" list --state-running --uuid); then warn "Libvirt inventory unavailable: $uri"; continue; fi
          for domain in $domains; do
            slot || break
            echo "Libvirt $uri $domain:"
            if [ "$uri" = lxc:/// ]; then
              if ! timeout 15 virsh -c "$uri" lxc-enter-namespace "$domain" -- /bin/sh -c ':'; then warn "LXC $domain has no accessible shell/namespace"; continue; fi
              if ! timeout 120 virsh -c "$uri" lxc-enter-namespace "$domain" -- /bin/sh -c "$self" -- "$script" "$self" "$reboot" "$depth"; then
                warn "LXC $domain could not be fully configured"
                failures=1
              fi
              continue
            fi
            command -v jq >/dev/null && command -v base64 >/dev/null || { warn "QEMU $domain requires existing jq/base64 transport helpers"; continue; }
            agent() { timeout 20 virsh -c "$uri" qemu-agent-command "$domain" --timeout 15 "$1" | jq -e '.return'; }
            request=$(jq -nc --args '{execute:"guest-exec",arguments:{path:"/bin/sh",arg:$ARGS.positional,"capture-output":true}}' -- -c "$self" -- "$script" "$self" "$reboot" "$depth")
            if ! pid=$(agent "$request" | jq -er '.pid'); then warn "QEMU $domain has no accessible guest agent or could not start /bin/sh"; continue; fi
            request=$(jq -nc --argjson pid "$pid" '{execute:"guest-exec-status",arguments:{pid:$pid}}')
            status='{}'
            polls=0
            while [ "$polls" -lt 60 ]; do
              if ! status=$(agent "$request"); then break; fi
              if printf '%s\n' "$status" | jq -e '.exited == true' >/dev/null; then break; fi
              polls=$((polls + 1))
              sleep 1
            done
            if ! printf '%s\n' "$status" | jq -r '."out-data" // ""' | base64 -d; then failures=1; fi
            if ! printf '%s\n' "$status" | jq -r '."err-data" // ""' | base64 -d >&2; then failures=1; fi
            if ! printf '%s\n' "$status" | jq -e '.exited == true and .exitcode == 0 and (."out-truncated" != true) and (."err-truncated" != true)' >/dev/null; then
              warn "QEMU $domain returned incomplete configuration results; a timed-out command may still be running"
              failures=1
            fi
          done
        done
      fi
      exit "$failures"
    script: |
      set -eu
      reboot=$1
      case "$reboot" in true|false) ;; *) echo 'Invalid automatic reboot checkbox value.' >&2; exit 1 ;; esac
      manual() { echo "WARNING: $*. Update this system manually." >&2; exit 0; }
      [ -r /etc/os-release ] || manual 'OS identification is unavailable'
      . /etc/os-release
      case "$ID" in
        debian|ubuntu) installer=apt ;;
        fedora|rhel|rocky|almalinux|ol|centos) installer=dnf ;;
        opensuse-leap|sles) installer=zypper ;;
        *) manual "Native security-only automatic updates are unsupported on $ID" ;;
      esac
      test -d /run/systemd/system && command -v systemctl >/dev/null || {
        manual 'No running native systemd scheduler is available';
      }
      case "$installer" in
        apt)
          command -v unattended-upgrade >/dev/null || {
            manual 'Native unattended-upgrades is not installed; no packages or configuration were changed'
          }
          systemctl cat apt-daily.timer apt-daily-upgrade.timer >/dev/null 2>&1 || manual 'Native apt timers are unavailable'
          # Clear inherited origin lists so only security pockets are eligible.
          cat > /etc/apt/apt.conf.d/52shui-security-updates <<'EOF'
      #clear Unattended-Upgrade::Allowed-Origins;
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Origins-Pattern {
        "origin=${distro_id},codename=${distro_codename}-security";
        "origin=${distro_id}ESMApps,suite=${distro_codename}-apps-security";
        "origin=${distro_id}ESM,suite=${distro_codename}-infra-security";
      };
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "false";
      EOF
          printf 'Unattended-Upgrade::Automatic-Reboot "%s";\n' "$reboot" >> /etc/apt/apt.conf.d/52shui-security-updates
          # Use distro timers, not a second update runner. Do not stop active dpkg work.
          systemctl enable --now apt-daily.timer apt-daily-upgrade.timer
          echo "Native apt security-update timers enabled; automatic reboot: $reboot. No immediate update was requested."
          exit 0
          ;;
        dnf)
          if systemctl cat dnf5-automatic.timer >/dev/null 2>&1; then
            timer=dnf5-automatic.timer
          elif systemctl cat dnf-automatic-install.timer >/dev/null 2>&1; then
            timer=dnf-automatic-install.timer
          else
            manual 'Native DNF automatic updater is not installed'
          fi
          config=/etc/dnf/automatic.conf
          [ ! -L "$config" ] || { echo 'Refusing symlinked DNF automatic configuration.' >&2; exit 1; }
          native_reboot=false
          if [ "$timer" = dnf5-automatic.timer ] || { [ -f "$config" ] && grep -Eq '^[#[:space:]]*reboot[[:space:]]*=' "$config"; }; then native_reboot=true; fi
          mode=never
          if [ "$reboot" = true ]; then
            if [ "$native_reboot" = true ]; then mode=when-needed
            else echo 'WARNING: Native conditional reboot is unavailable; reboot manually when required.' >&2; fi
          fi
          work=$(mktemp /etc/dnf/.automatic.XXXXXX)
          trap 'rm -f "$work"' EXIT HUP INT TERM
          input=/dev/null
          if [ -f "$config" ]; then cp -p "$config" "$work"; input=$config; fi
          # Preserve unrelated sections and settings; replace only the selected policy.
          awk -v native="$native_reboot" -v mode="$mode" '
            function policy() {
              print "upgrade_type = security\ndownload_updates = yes\napply_updates = yes"
              if (native == "true") print "reboot = " mode
            }
            /^[[:space:]]*\[/ {
              if (commands) policy()
              commands = ($0 ~ /^[[:space:]]*\[commands\][[:space:]]*$/)
              if (commands) found=1
            }
            commands && /^[[:space:]]*(upgrade_type|download_updates|apply_updates|reboot)[[:space:]]*=/ { next }
            { print }
            END { if (commands) policy(); if (!found) { print "[commands]"; policy() } }
          ' "$input" > "$work"
          mv "$work" "$config"
          systemctl enable --now "$timer"
          echo "Native $timer enabled for security-only updates; no immediate update was requested."
          ;;
        zypper)
          [ -x /usr/lib/YaST2/bin/online_update ] && [ -f /etc/sysconfig/automatic_online_update ] || manual 'Native YaST automatic online updater is unavailable'
          systemctl is-active --quiet cron.service || manual 'Native cron scheduler is not running'
          scheduled=false
          for interval in daily weekly monthly; do
            if [ -L "/etc/cron.$interval/opensuse.org-online_update" ] && [ "$(readlink "/etc/cron.$interval/opensuse.org-online_update")" = /usr/lib/YaST2/bin/online_update ]; then scheduled=true; fi
          done
          [ "$scheduled" = true ] || manual 'Configure a native YaST automatic online update schedule first'
          config=/etc/sysconfig/automatic_online_update
          [ ! -L "$config" ] || { echo 'Refusing symlinked YaST automatic configuration.' >&2; exit 1; }
          work=$(mktemp /etc/sysconfig/.automatic_online_update.XXXXXX)
          trap 'rm -f "$work"' EXIT HUP INT TERM
          cp -p "$config" "$work"
          sed '/^[[:space:]]*AOU_\(ENABLE_CRONJOB\|SKIP_INTERACTIVE_PATCHES\|INCLUDE_RECOMMENDS\|PATCH_CATEGORIES\)=/d' "$config" > "$work"
          cat >> "$work" <<'EOF'
      AOU_ENABLE_CRONJOB="true"
      AOU_SKIP_INTERACTIVE_PATCHES="true"
      AOU_INCLUDE_RECOMMENDS="false"
      AOU_PATCH_CATEGORIES="security"
      EOF
          mv "$work" "$config"
          if [ "$reboot" = true ]; then echo 'WARNING: Native conditional reboot is unavailable here; reboot manually when required.' >&2; fi
          echo 'Native YaST security-only automatic updates configured; no immediate update was requested.'
          ;;
      esac
  - name: Install Docker / Podman
    packages: *install_packages
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{elevate} -- %{script} %{input:engine} %{input:runsc} %{input:runq} %{input:nvidia} %{packages}
    elevate: *recipe_elevate
    inputs:
      - id: engine
        type: pickString
        description: Container engine
        options: [Docker, Podman]
        default: Docker
      - {id: runsc, type: checkbox, description: Install runsc (gVisor; Docker only), default: false}
      - {id: runq, type: checkbox, description: Install runq (requires KVM; Docker only), default: false}
      - {id: nvidia, type: checkbox, description: 'Install nvidia-docker (NVIDIA toolkit; Docker only)', default: false}
    script: |
      set -eu
      case "$1" in Docker) engine=docker ;; Podman) engine=podman ;; *) echo 'Invalid container engine.' >&2; exit 1 ;; esac
      runsc=$2 runq=$3 nvidia=$4
      packages=$5
      for selected in "$runsc" "$runq" "$nvidia"; do
        case "$selected" in true|false) ;; *) echo 'Invalid runtime checkbox value.' >&2; exit 1 ;; esac
      done
      if [ "$engine" != docker ] && [ "$runsc:$runq:$nvidia" != false:false:false ]; then
        echo 'Optional runtimes require Docker, not Podman.' >&2; exit 1
      fi
      if [ "$runq" = true ] && { [ ! -c /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; }; then
        echo 'runq requires usable KVM support at /dev/kvm.' >&2; exit 1
      fi
      . /etc/os-release
      install_packages() {
        sh -c "$packages" -- "$@"
      }
      package=$engine
      if [ "$engine" = docker ]; then
        test -d /run/systemd/system || command -v rc-service >/dev/null || {
          echo 'Docker requires systemd or OpenRC to manage its daemon.' >&2; exit 1;
        }
        case " $ID ${ID_LIKE:-} " in
          *' debian '*|*' ubuntu '*) package=docker.io ;;
          *' fedora '*|*' rhel '*|*' rocky '*) package=moby-engine ;;
        esac
      fi
      if ! command -v "$engine" >/dev/null || { [ "$engine" = docker ] && ! command -v dockerd >/dev/null; }; then install_packages "$package"; fi
      # Debian splits the client from the daemon; both are required for Docker.
      if [ "$engine" = docker ] && ! command -v docker >/dev/null; then
        if apt-cache show docker-cli >/dev/null 2>&1; then install_packages docker-cli; fi
      fi
      if [ "$ID" = alpine ] && [ "$engine" = docker ] && [ ! -f /etc/init.d/docker ]; then install_packages docker-openrc; fi
      if [ "$engine" = docker ]; then
        if [ -d /run/systemd/system ]; then
          systemctl enable --now docker
        else
          rc-update add docker default
          rc-service docker start
        fi
        docker info
      else
        if info=$(LC_ALL=C podman info 2>&1); then printf '%s\n' "$info"
        else
          case "$info" in
            *'default OCI runtime "crun" not found'*) install_packages crun ;;
            *'default OCI runtime "runc" not found'*) install_packages runc ;;
            *) printf '%s\n' "$info" >&2; exit 1 ;;
          esac
          podman info
        fi
      fi
      if [ "$runsc:$runq:$nvidia" != false:false:false ]; then
        set --
        if ! command -v jq >/dev/null; then set -- jq; fi
        if [ "$runsc" = true ] && ! command -v runsc >/dev/null; then set -- "$@" runsc; fi
        if [ "$runq" = true ] && ! command -v runq >/dev/null && [ ! -x /var/lib/runq/runq ]; then set -- "$@" runq; fi
        if [ "$nvidia" = true ] && ! command -v nvidia-ctk >/dev/null; then set -- "$@" nvidia-container-toolkit; fi
        if ! install_packages "$@"; then
          echo 'A selected runtime could not be installed from enabled repositories; no source builds or repositories were added.' >&2
          exit 1
        fi
        mkdir -p /etc/docker
        config=/etc/docker/daemon.json
        test ! -L "$config" || { echo 'Refusing symlinked Docker configuration.' >&2; exit 1; }
        work=$(mktemp -d /etc/docker/.shui-runtimes.XXXXXX)
        trap 'rm -rf "$work"' 0
        if [ -e "$config" ]; then cp "$config" "$work/daemon.json"; else echo '{}' > "$work/daemon.json"; fi
        if [ "$nvidia" = true ]; then
          nvidia-ctk runtime configure --runtime=docker --config="$work/daemon.json"
        fi
        for runtime in runsc runq; do
          case "$runtime" in runsc) selected=$runsc ;; runq) selected=$runq ;; esac
          [ "$selected" = true ] || continue
          binary=$(command -v "$runtime" || true)
          if [ -z "$binary" ] && [ "$runtime" = runq ] && [ -x /var/lib/runq/runq ]; then binary=/var/lib/runq/runq; fi
          "$binary" --version
          jq --arg name "$runtime" --arg binary "$binary" '.runtimes[$name].path = $binary' "$work/daemon.json" > "$work/next"
          mv "$work/next" "$work/daemon.json"
        done
        dockerd --validate --config-file "$work/daemon.json"
        if [ -e "$config" ]; then chmod "$(stat -c %a "$config")" "$work/daemon.json"; else chmod 644 "$work/daemon.json"; fi
        mv "$work/daemon.json" "$config"
        if [ -d /run/systemd/system ]; then systemctl reload docker; else rc-service docker reload; fi
        # A service reload can return before Docker handles SIGHUP.
        for attempt in 1 2 3 4 5; do
          docker info --format '{{json .Runtimes}}' > "$work/registered"
          if jq -e --argjson runsc "$runsc" --argjson runq "$runq" --argjson nvidia "$nvidia" '
            ($runsc == false or has("runsc")) and
            ($runq == false or has("runq")) and
            ($nvidia == false or has("nvidia"))
          ' "$work/registered" >/dev/null; then exit 0; fi
          [ "$attempt" -eq 5 ] || sleep 1
        done
        echo 'Docker did not register the selected runtimes after reload.' >&2
        exit 1
      fi
  - name: Configure log limits and cleanup
    packages: *install_packages
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{elevate} -- %{bootstrap} %{bootstrap} %{maintenance} %{packages} %{input:disk} %{input:runtime} %{input:days} %{input:file_size} %{input:backups} %{input:cleanup} %{input:all_archives} %{input:package_caches} %{input:user_caches} %{input:all_users} %{input:guests} %{input:depth}
    elevate: *recipe_elevate
    inputs:
      - {id: disk, type: promptString, description: 'Disk journal cap (bytes or K/M/G/T; e.g. 512M)', default: 512M, required: true, pattern: &log_size_pattern '[1-9][0-9]*[KMGT]?', validation_message: &log_size_hint 'Use positive bytes or an uppercase K/M/G/T suffix, e.g. 512M'}
      - {id: runtime, type: promptString, description: 'Runtime journal cap (bytes or K/M/G/T; e.g. 128M)', default: 128M, required: true, pattern: *log_size_pattern, validation_message: *log_size_hint}
      - {id: days, type: promptString, description: Retention in days (1-36500), default: '30', required: true, pattern: '(?:[1-9][0-9]{0,3}|[12][0-9]{4}|3[0-5][0-9]{3}|36[0-4][0-9]{2}|36500)', validation_message: Enter whole days from 1 to 36500}
      - {id: file_size, type: promptString, description: 'Per-log cap (bytes or K/M/G/T; e.g. 10M)', default: 10M, required: true, pattern: *log_size_pattern, validation_message: *log_size_hint}
      - {id: backups, type: promptString, description: Rotated files per log (1-100), default: '3', required: true, pattern: '(?:[1-9][0-9]?|100)', validation_message: Enter a whole number from 1 to 100}
      - {id: cleanup, type: checkbox, description: Clean expired/excess rotated logs (active logs kept), default: true}
      - {id: all_archives, type: checkbox, description: 'Delete ALL rotated logs and selected caches now (ignore age)', default: false}
      - {id: package_caches, type: checkbox, description: Clean package caches, default: false}
      - {id: user_caches, type: checkbox, description: Clean login-user ~/.cache (respect retention), default: false}
      - {id: all_users, type: checkbox, description: Include all local users (requires user cache cleanup), default: false}
      - {id: guests, type: checkbox, description: Also clean running VM guests recursively, default: false}
      - {id: depth, type: promptString, description: Guest depth (0-5; 0 disables traversal), default: '2', required: true, pattern: '[0-5]', validation_message: Enter one digit from 0 to 5}
    bootstrap: |
      set -eu
      bootstrap=$1
      maintenance=$2
      packages=$3
      shift 3
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      bytes() {
        number=${1%[KMGT]} factor=1
        case "$number" in ''|0*|*[!0-9]*) fail 'Use positive bytes or a K/M/G/T suffix' ;; esac
        case "$1" in *K) factor=1024 ;; *M) factor=1048576 ;; *G) factor=1073741824 ;; *T) factor=1099511627776 ;; esac
        [ "${#number}" -le 18 ] && [ "$number" -le "$((1152921504606846976 / factor))" ] || fail 'Log size is too large'
        echo "$((number * factor))"
      }
      bytes "$1" >/dev/null
      bytes "$2" >/dev/null
      file_bytes=$(bytes "$4")
      case "$3" in ''|0*|*[!0-9]*) fail 'Days must be 1-36500' ;; esac
      [ "${#3}" -le 5 ] && [ "$3" -le 36500 ] || fail 'Days must be 1-36500'
      case "$5" in ''|0*|*[!0-9]*) fail 'Backups must be 1-100' ;; esac
      [ "${#5}" -le 3 ] && [ "$5" -le 100 ] || fail 'Backups must be 1-100'
      case "${12}" in [0-5]) ;; *) fail 'Guest depth must be 0-5' ;; esac
      for selected in "$6" "$7" "$8" "$9" "${10}" "${11}"; do
        case "$selected" in true|false) ;; *) fail 'Invalid cleanup checkbox value' ;; esac
      done
      [ "$7" != true ] || [ "$6" = true ] || fail 'Deleting all archives requires rotated-log cleanup'
      [ "${10}" != true ] || [ "$9" = true ] || fail 'All-user scope requires user cache cleanup'
      # Depth-zero children still owe their parent a traversal result.
      guests=false
      if [ "${11}" = true ] && { [ "${12}" != 0 ] || [ "$#" -gt 12 ]; }; then guests=true; fi
      missing=
      for tool in bash logrotate; do command -v "$tool" >/dev/null || missing="$missing $tool"; done
      if command -v docker >/dev/null || [ "$guests" = true ]; then
        command -v jq >/dev/null || missing="$missing jq"
      fi
      command -v timeout >/dev/null || missing="$missing coreutils"
      if [ "$6:$9" != false:false ] && ! find . --version >/dev/null 2>&1; then missing="$missing findutils"; fi
      # shellcheck disable=SC2086 # Split only the fixed package names above.
      sh -c "$packages" -- $missing
      exec timeout 600 bash -c "$maintenance" -- "$bootstrap" "$maintenance" "$packages" "$file_bytes" "$guests" "$@"
    maintenance: |
      set -euo pipefail
      bootstrap=$1
      source=$2
      packages=$3 file_bytes=$4 guests=$5
      shift 5
      options=("${@:1:12}")
      disk=$1 runtime=$2 days=$3 backups=$5 cleanup_logs=$6 all_archives=$7 package_caches=$8 user_caches=$9
      all_users=${10} depth=${12}
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      aggressive=0
      [[ $all_archives != true ]] || aggressive=1
      umask 077
      work=$(mktemp -d)
      trap 'rm -rf -- "$work"' EXIT
      if [[ $guests == true ]]; then
        context=${13-'{"seen":[],"remaining":16}'}
        printf '%s\n' "$context" | jq -e 'select(.remaining >= 0 and .remaining <= 16 and (.seen | type == "array") and (.seen | all(type == "string" and test("^[0-9a-f]{32}$"))))' > "$work/context"
        identity=$(cat /etc/machine-id 2>/dev/null || true)
        if [[ $identity =~ ^[0-9a-f]{32}$ ]]; then
          if jq -e --arg id "$identity" '.seen | index($id) != null' "$work/context" >/dev/null; then
            printf 'Skipping previously visited guest\nSHUI_LOG_RESULT=%s\n' "$(jq -c . "$work/context")"
            exit 0
          fi
          jq --arg id "$identity" '.seen += [$id]' "$work/context" > "$work/next"
          mv "$work/next" "$work/context"
        fi
      fi

      # Write beside the destination, validate, then atomically replace it.
      write_config() (
        set -e
        path=$1
        [[ ! -L $path ]] || fail "Refusing symlinked configuration: $path"
        (umask 022; mkdir -p -- "$(dirname "$path")")
        temporary=$(mktemp "${path}.shui.XXXXXX")
        trap 'rm -f -- "$temporary"' EXIT
        cat > "$temporary"
        if [[ -e $path ]]; then chmod "$(stat -c %a "$path")" "$temporary"; else chmod 644 "$temporary"; fi
        if [[ $path == /etc/docker/daemon.json ]] && command -v dockerd >/dev/null; then
          dockerd --validate --config-file "$temporary"
        fi
        mv -- "$temporary" "$path"
      )
      journals() {
        if [[ ! -d /run/systemd/system ]] || ! command -v journalctl >/dev/null; then
          echo 'No running systemd journal; skipping journal limits'
          return
        fi
        printf '[Journal]\nSystemMaxUse=%s\nRuntimeMaxUse=%s\nMaxRetentionSec=%sday\n' "$disk" "$runtime" "$days" |
          write_config /etc/systemd/journald.conf.d/90-shui-limits.conf
        systemctl restart systemd-journald
        [[ $cleanup_logs == true ]] || return 0
        journalctl --rotate
        if (( aggressive )); then
          journalctl --vacuum-size=1
        else
          for base in /var/log/journal /run/log/journal; do
            limit=$disk
            [[ $base != /run/log/journal ]] || limit=$runtime
            for directory in "$base"/*; do
              if [[ -d $directory && ! -L $directory ]]; then
                journalctl --directory="$directory" --vacuum-size="$limit" --vacuum-time="${days}days"
              fi
            done
          done
        fi
        journalctl --disk-usage
      }
      text_logs() {
        if [[ ! -e /etc/logrotate.conf ]]; then printf 'include /etc/logrotate.d\n' | write_config /etc/logrotate.conf; fi
        # Change global defaults only; keep service rules and rotation hooks.
        awk -v size="$file_bytes" -v backups="$backups" -v days="$days" '
          BEGIN { print "# BEGIN SHUI LIMITS\nmaxsize " size "\nrotate " backups "\nmaxage " days "\n# END SHUI LIMITS" }
          /^# BEGIN SHUI LIMITS$/ { managed=1; next }
          /^# END SHUI LIMITS$/ { managed=0; next }
          managed { next }
          depth == 0 && /^[[:space:]]*(maxsize|maxage|rotate)[[:space:]]/ { next }
          { print }
          /^[[:space:]]*(prerotate|postrotate|firstaction|lastaction|preremove)[[:space:]]*$/ { hook=1 }
          /^[[:space:]]*endscript[[:space:]]*$/ { hook=0; next }
          !hook && !/^[[:space:]]*#/ { line=$0; depth += gsub(/\{/, "", line) - gsub(/\}/, "", line) }
        ' /etc/logrotate.conf > "$work/logrotate"
        write_config /etc/logrotate.conf < "$work/logrotate"
        if [[ -d /run/systemd/system ]]; then
          systemctl enable --now logrotate.timer
        elif command -v rc-service >/dev/null; then
          rc-update add crond default
          rc-service crond start
        else
          echo 'WARNING: verify that cron runs logrotate on this host'
        fi
        if [[ $cleanup_logs == true ]]; then logrotate /etc/logrotate.conf; fi
      }
      container_logs() {
        if command -v docker >/dev/null; then
          config=/etc/docker/daemon.json
          if [[ -e $config ]]; then cat "$config" > "$work/docker"; else echo '{}' > "$work/docker"; fi
          driver=$(jq -r '."log-driver" // empty' "$work/docker")
          if [[ -z $driver ]]; then driver=$(docker info --format '{{.LoggingDriver}}'); fi
          case "$driver" in
            json-file|local)
              jq --arg size "$file_bytes" --arg count "$backups" '
                .["log-opts"] = ((.["log-opts"] // {}) + {"max-size":$size,"max-file":$count})
              ' "$work/docker" | write_config "$config"
              echo 'WARNING: Restart Docker at a suitable time, then recreate existing containers to apply saved defaults; no workloads were restarted' ;;
            journald) ;;
            *) echo "WARNING: Docker driver $driver needs its own retention policy" ;;
          esac
        fi
        if command -v podman >/dev/null; then
          printf '[containers]\nlog_size_max=%s\n' "$file_bytes" |
            write_config /etc/containers/containers.conf.d/90-shui-logging.conf
          echo 'WARNING: Podman limits apply to new containers; existing containers require recreation and user overrides may take precedence'
        fi
      }
      libvirt_logs() {
        [[ -d /etc/libvirt ]] || return 0
        config=/etc/libvirt/virtlogd.conf
        if [[ -e $config ]]; then
          sed '/^[[:space:]]*max_size[[:space:]]*=/d; /^[[:space:]]*max_backups[[:space:]]*=/d' "$config" > "$work/virtlogd"
        else : > "$work/virtlogd"; fi
        printf '\nmax_size = %s\nmax_backups = %s\n' "$file_bytes" "$backups" >> "$work/virtlogd"
        write_config "$config" < "$work/virtlogd"
        if [[ -d /run/systemd/system ]] && systemctl is-active --quiet virtlogd; then
          # Re-exec preserves VM log descriptors; do not restart VMs.
          systemctl kill --kill-whom=main --signal=SIGUSR1 virtlogd
        else echo 'WARNING: virtlogd limits take effect when it next starts'; fi
      }
      archives() {
        [[ $cleanup_logs == true ]] || return 0
        : > "$work/known-logs"
        for state in /var/lib/logrotate/status /var/lib/logrotate/logrotate.status; do
          if [[ -f $state ]]; then sed -n 's/^"\([^"]*\)" [0-9].*/\1/p' "$state" >> "$work/known-logs"; fi
        done
        mkdir "$work/archive-directories"
        # GNU find -execdir holds the containing directory open. Delete only
        # basenames from that directory, never through user-controlled parents.
        archive_cleanup=$(cat <<'SH'
      set -euo pipefail
      backups=$1 cutoff=$2 aggressive=$3 work=$4
      directory="$work/archive-directories/$(stat -c '%d-%i' .)"
      [[ ! -d $directory ]] || exit 0
      mkdir "$directory"
      declare -A counts=()
      find -P . -maxdepth 1 -type f -printf '%T@ %p\0' | sort -z -nr |
      while IFS= read -r -d '' record; do
        modified=${record%% *} file=${record#* }
        [[ $file =~ ^(.+)(\.[1-9][0-9]*|-[0-9]{8})(\.(gz|xz|bz2|zst))?$ ]] || continue
        stem=${BASH_REMATCH[1]}
        count=${counts["$stem"]:-0}
        counts["$stem"]=$((count + 1))
        if (( aggressive || count >= backups || ${modified%%.*} < cutoff )); then
          recognized=false
          if grep -Fxq "$PWD/${stem#./}" "$work/known-logs"; then recognized=true; fi
          case "$PWD/${file#./}" in /var/log/libvirt/qemu/*.log.*|/var/log/libvirt/lxc/*.log.*) recognized=true ;; esac
          if [[ $recognized != true ]]; then
            answer=
            printf 'Unknown rotated log: %q\n' "$PWD/${file#./}"
            if ! { printf 'Delete this unknown rotated log? [y/N]: '; read -r answer; } 2>/dev/null <> /dev/tty; then
              echo 'WARNING: No confirmation terminal; keeping unknown log.'
              continue
            fi
            case "$answer" in y|Y|yes|YES) ;; *) continue ;; esac
          fi
          # Check after confirmation: an earlier snapshot may already be stale.
          if ! find -L /proc/[0-9]*/fd -maxdepth 1 -ignore_readdir_race -samefile "$file" -print -quit > "$work/open-log" 2>/dev/null || [[ -s $work/open-log ]]; then
            printf 'Keeping open or unverifiable log: %q\n' "$PWD/$file"
            continue
          fi
          rm -f -- "$file"
        fi
      done
      SH
        )
        cutoff=$(( $(date +%s) - days * 86400 ))
        find -P /var/log -regextype posix-extended -ignore_readdir_race -name journal -prune -o \
          -type f -regex '.*(\.[1-9][0-9]*|-[0-9]{8})(\.(gz|xz|bz2|zst))?' \
          -execdir bash -c "$archive_cleanup" -- "$backups" "$cutoff" "$aggressive" "$work" {} +
        echo 'Archive cleanup finished; active and engine-owned container logs are preserved'
      }
      cache_cleanup() {
        if [[ $package_caches == true ]]; then
          if command -v apt-get >/dev/null; then
            if (( aggressive )); then apt-get clean; else apt-get autoclean; fi
          elif command -v dnf >/dev/null; then
            if (( aggressive )); then dnf clean all; else dnf clean packages; fi
          elif command -v zypper >/dev/null; then
            if (( aggressive )); then zypper --non-interactive clean --all; else zypper --non-interactive clean --packages; fi
          elif command -v pacman >/dev/null; then
            if (( aggressive )); then pacman -Scc --noconfirm; else pacman -Sc --noconfirm; fi
          elif command -v apk >/dev/null; then apk cache clean; fi
        fi
        [[ $user_caches == true ]] || return 0
        if [[ $all_users == true ]]; then
          awk -F: '$3 == 0 || ($3 >= 1000 && $3 < 65534)' /etc/passwd > "$work/users"
        else
          getent passwd "${SUDO_USER:-root}" > "$work/users"
        fi
        cache_script=$(cat <<'SH'
      set -euo pipefail
      cache=$1/.cache days=$2 aggressive=$3
      [[ ! -L $cache ]] || { echo "Refusing symlinked user cache: $cache" >&2; exit 1; }
      [[ -d $cache ]] || exit 0
      if (( aggressive )); then
        find -P "$cache" -mindepth 1 -type f -delete
      else
        find -P "$cache" -mindepth 1 -type f -mmin "+$((days * 1440))" -delete
      fi
      find -P "$cache" -depth -mindepth 1 -type d -empty -delete
      SH
        )
        while IFS=: read -r user _password uid _gid _comment home _shell; do
          # Drop privileges before touching any user-controlled cache paths.
          if [[ $uid == 0 ]]; then
            bash -c "$cache_script" -- "$home" "$days" "$aggressive"
          elif command -v runuser >/dev/null; then
            runuser -u "$user" -- bash -c "$cache_script" -- "$home" "$days" "$aggressive"
          else
            printf -v command '%q ' bash -c "$cache_script" -- "$home" "$days" "$aggressive"
            su -s /bin/bash -c "$command" "$user"
          fi
        done < "$work/users"
      }
      guest_logs() {
        [[ $guests == true && $depth != 0 ]] || return 0
        if ! command -v virsh >/dev/null; then echo 'No libvirt client; skipping guest traversal'; return; fi
        virsh -c qemu:///system list --state-running --uuid > "$work/domains"
        child=("${options[@]}")
        child[11]=$((depth - 1))
        uncertain_guest() {
          # Unknown child progress must not let ancestors reuse its guest budget.
          jq '.remaining = 0' "$work/context" > "$work/next"
          mv "$work/next" "$work/context"
          fail "$*"
        }
        failed=0
        while IFS= read -r domain; do
          [[ -n $domain ]] || continue
          remaining=$(jq -r '.remaining' "$work/context")
          (( remaining > 0 )) || fail 'Reached the 16-guest traversal budget'
          jq '.remaining -= 1' "$work/context" > "$work/next"
          mv "$work/next" "$work/context"
          agent() { virsh -c qemu:///system qemu-agent-command "$domain" --timeout 15 "$1" | jq -e '.return'; }
          if ! agent '{"execute":"guest-ping"}' >/dev/null; then
            echo "FAILED: Guest $domain has no accessible agent" >&2
            failed=1
            continue
          fi
          request=$(jq -nc --args '{execute:"guest-exec",arguments:{path:"/bin/sh",arg:$ARGS.positional,"capture-output":true}}' \
            -- -c "$bootstrap" -- "$bootstrap" "$source" "$packages" "${child[@]}" "$(cat "$work/context")")
          if ! pid=$(agent "$request" | jq -er '.pid'); then uncertain_guest "Guest $domain execution could not be confirmed"; fi
          request=$(jq -nc --argjson pid "$pid" '{execute:"guest-exec-status",arguments:{pid:$pid}}')
          end=$((SECONDS + 180))
          status='{}'
          while (( SECONDS < end )); do
            if ! status=$(agent "$request"); then break; fi
            if jq -e '.exited == true' <<< "$status" >/dev/null; then break; fi
            sleep 1
          done
          if ! jq -e '.exited == true' <<< "$status" >/dev/null; then
            uncertain_guest "Guest $domain execution timed out or status was lost; it may still be running"
          fi
          if ! jq -r '."out-data" // ""' <<< "$status" | base64 -d > "$work/output"; then
            uncertain_guest "Guest $domain returned invalid output"
          fi
          if ! jq -r '."err-data" // ""' <<< "$status" | base64 -d >&2; then
            uncertain_guest "Guest $domain returned invalid error output"
          fi
          printf 'Guest %s:\n' "$domain"
          cat "$work/output"
          returned=$(sed -n 's/^SHUI_LOG_RESULT=//p' "$work/output" | tail -n 1)
          if [[ -z $returned ]] || ! jq -e '.remaining >= 0 and .remaining <= 16 and (.seen | all(type == "string" and test("^[0-9a-f]{32}$")))' <<< "$returned" >/dev/null; then
            uncertain_guest "Guest $domain returned incomplete maintenance results"
          fi
          jq --argjson child "$returned" '.remaining = ([.remaining,$child.remaining] | min) | .seen = ((.seen + $child.seen) | unique | .[:32])' \
            "$work/context" > "$work/next"
          mv "$work/next" "$work/context"
          if ! jq -e '.exitcode == 0 and (."out-truncated" != true)' <<< "$status" >/dev/null; then failed=1; fi
        done < "$work/domains"
        return "$failed"
      }
      failures=0
      for action in journals text_logs container_logs libvirt_logs archives cache_cleanup guest_logs; do
        # A separate shell scope retains fail-fast behavior within each action,
        # while allowing the remaining independent actions to report outcomes.
        set +e
        ( set -e; "$action" )
        status=$?
        set -e
        if (( status == 0 )); then echo "OK: $action"; else echo "FAILED: $action" >&2; failures=$((failures + 1)); fi
      done
      if [[ $guests == true ]]; then printf 'SHUI_LOG_RESULT=%s\n' "$(jq -c . "$work/context")"; fi
      (( failures == 0 )) || fail 'Incomplete log maintenance'
  - name: Configure firewall
    packages: *install_packages
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{prepare} -- %{script} %{firewall} %{input:ssh_ips} %{input:ports} %{packages}
    prepare: |
      set -eu
      # Use the server-side SSH port, including SSH-config aliases and NAT.
      connection=${SSH_CONNECTION:-}
      test -n "$connection" || { echo 'Cannot determine the SSH server port.' >&2; exit 1; }
      port=${connection##* }
      script=$1
      shift
      packages=$4
      if [ "$(id -u)" = 0 ]; then exec sh -c "$script" -- "$1" "$2" "$3" "$port" "$packages"; fi
      exec sudo sh -c "$script" -- "$1" "$2" "$3" "$port" "$packages"
    inputs:
      - id: ssh_ips
        type: promptString
        description: SSH IPs/CIDRs (space/comma separated; blank = any)
        default: ''
        pattern: '[ ]*(?:[0-9A-Fa-f:.]+(?:/[0-9]{1,3})?)(?:[ ,]+[0-9A-Fa-f:.]+(?:/[0-9]{1,3})?)*[ ]*'
        validation_message: 'Use IPs/CIDRs separated by spaces or commas, e.g. 192.0.2.1 2001:db8::/64; blank allows any'
      - id: ports
        type: promptString
        description: Port whitelist (80/tcp 53/udp 8000-8010/tcp; no SSH)
        default: ''
        pattern: '[ ]*(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])(?:-(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?/(?:tcp|udp)(?:[ ,]+(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])(?:-(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?/(?:tcp|udp))*[ ]*'
        validation_message: 'Whitelist port/tcp or port/udp (1-65535); spaces/commas separate entries. SSH and ranges containing it are rejected'
    script: |
      set -eu
      . /etc/os-release
      test -d /run/systemd/system || { echo 'This firewall recipe requires a running systemd host.' >&2; exit 1; }
      if ! command -v ip >/dev/null; then
        case " $ID ${ID_LIKE:-} " in *' fedora '*|*' rhel '*|*' rocky '*) package=iproute ;; *) package=iproute2 ;; esac
        sh -c "$5" -- "$package"
      fi
      sh -c "$1" -- validate "$2" "$3" "$4"
      case " $ID ${ID_LIKE:-} " in
        *' debian '*|*' ubuntu '*)
          backend=ufw
          if systemctl is-active --quiet firewalld; then echo 'firewalld is already active; refusing to enable UFW alongside it.' >&2; exit 1; fi
          if ! command -v ufw >/dev/null; then sh -c "$5" -- ufw; fi ;;
        *' fedora '*|*' rhel '*|*' rocky '*|*' suse '*|*' opensuse-tumbleweed '*|*' arch '*)
          backend=firewalld
          if ! command -v firewall-cmd >/dev/null; then sh -c "$5" -- firewalld; fi ;;
        *) echo "Unsupported firewall installer for $ID." >&2; exit 1 ;;
      esac
      exec sh -c "$1" -- "$backend" "$2" "$3" "$4"
    firewall: |
      set -eu
      set -f
      backend=$1 sources=$2 ports=$3 ssh=$4
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      port_number() {
        case "$1" in ''|*[!0-9]*) return 1 ;; esac
        [ "${#1}" -le 5 ] && [ "$1" -ge 1 ] && [ "$1" -le 65535 ]
      }
      port_number "$ssh" || fail 'Invalid SSH port'
      sources=$(printf '%s\n' "$sources" | tr ',' ' ' | awk '{$1=$1; print}')
      ports=$(printf '%s\n' "$ports" | tr ',' ' ' | awk '{$1=$1; print}')
      # iproute2 validates numeric IPv4/IPv6 addresses and prefix lengths without
      # changing routes. Reject hostnames and shell syntax before invoking it.
      for source in $sources; do
        case "$source" in *[!0-9a-fA-F:./]*) fail "Invalid SSH source: $source" ;; esac
        case "$source" in
          *:*) ip -6 route show match "$source" >/dev/null || fail "Invalid SSH source: $source" ;;
          *) printf '%s\n' "$source" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(/[0-9]+)?$' || fail "Invalid SSH source: $source"
             ip -4 route show match "$source" >/dev/null || fail "Invalid SSH source: $source" ;;
        esac
      done
      for entry in $ports; do
        protocol=${entry##*/} range=${entry%/*}
        case "$protocol" in tcp|udp) ;; *) fail 'Ports require /tcp or /udp' ;; esac
        start=${range%-*} end=${range#*-}
        port_number "$start" && port_number "$end" && [ "$start" -le "$end" ] || fail 'Port range must be within 1-65535'
        if [ "$start" -le "$ssh" ] && [ "$ssh" -le "$end" ]; then
          fail 'Configure SSH access with SSH allowed IPs, not the port whitelist'
        fi
      done
      [ "$backend" != validate ] || exit 0
      umask 077
      work=$(mktemp -d)
      trap 'rm -rf -- "$work"' 0
      if [ "$backend" = ufw ]; then
        [ ! -L /etc/default/ufw ] || fail 'Refusing symlinked UFW configuration'
        [ ! -L /etc/ufw ] || fail 'Refusing symlinked UFW directory'
        cp -a /etc/ufw "$work/ufw"
        cp -p /etc/default/ufw "$work/default-ufw"
        previous_active=false
        previous_status=$(LC_ALL=C ufw status)
        case "$previous_status" in
          'Status: active'*) previous_active=true ;;
          'Status: inactive'*) ;;
          *) fail 'Cannot determine the current UFW state; no rules were changed' ;;
        esac
        previous_enabled=false
        if systemctl is-enabled --quiet ufw; then previous_enabled=true; fi
        rollback_ufw() {
          status=$?
          trap - 0
          set +e
          if [ "$status" -ne 0 ]; then
            echo 'Firewall setup failed; restoring previous UFW configuration.' >&2
            restored=true
            cp -a "$work/ufw/." /etc/ufw/ || restored=false
            cp -p "$work/default-ufw" /etc/default/ufw || restored=false
            if [ "$previous_active" = true ]; then ufw --force enable || restored=false; else ufw --force disable || restored=false; fi
            if [ "$previous_enabled" = true ]; then systemctl enable ufw || restored=false; else systemctl disable ufw || restored=false; fi
            if [ "$restored" != true ]; then
              echo "WARNING: UFW restoration failed. Backups retained in $work; restore protection manually." >&2
              exit "$status"
            fi
          fi
          rm -rf -- "$work"
          exit "$status"
        }
        trap rollback_ufw 0
        trap 'exit 1' HUP INT TERM
        sed -i 's/^IPV6=.*/IPV6=yes/' /etc/default/ufw
        grep -q '^IPV6=yes$' /etc/default/ufw || printf '\nIPV6=yes\n' >> /etc/default/ufw
        # UFW lists numbered rules only while active; keep outgoing/forwarded rules.
        ufw --force enable
        LC_ALL=C ufw status numbered > "$work/rules"
        awk '
          /^\[[[:space:]]*[0-9]+\]/ {
            sub(/ # .*/, "")
            if ($0 !~ /[[:space:]](ALLOW|DENY|REJECT|LIMIT)[[:space:]]+IN[[:space:]]/) next
            sub(/^\[[[:space:]]*/, ""); sub(/\].*/, ""); print
          }
        ' "$work/rules" | sort -rn > "$work/incoming"
        while read -r number; do ufw --force delete "$number"; done < "$work/incoming"
        if [ -n "$sources" ]; then
          ufw prepend deny in proto tcp to any port "$ssh" comment shui-ssh
        fi
        for source in ${sources:-any}; do
          ufw prepend allow in proto tcp from "$source" to any port "$ssh" comment shui-ssh
        done
        for entry in $ports; do
          protocol=${entry##*/} range=${entry%/*}
          range=$(printf '%s' "$range" | tr '-' ':')
          ufw allow "$range/$protocol"
        done
        ufw default deny incoming
        systemctl enable ufw
        ufw status verbose
      else
        if systemctl is-active --quiet ufw; then fail 'UFW is active; refusing to enable firewalld alongside it'; fi
        systemctl enable --now firewalld
        default=$(firewall-cmd --get-default-zone)
        active=$(firewall-cmd --get-active-zones)
        { printf '%s\n' "$default"; printf '%s\n' "$active" | awk 'NF && !/^[[:space:]]/ {print $1}'; } | sort -u > "$work/zones"
        while IFS= read -r zone; do
          # Replace existing allowances so omitted ports really are blocked.
          for kind in services ports protocols source-ports forward-ports; do
            entries=$(firewall-cmd --permanent --zone="$zone" --list-"$kind")
            case "$kind" in
              services) option=service ;;
              ports) option=port ;;
              protocols) option=protocol ;;
              source-ports) option='source-port' ;;
              forward-ports) option='forward-port' ;;
            esac
            for entry in $entries; do firewall-cmd --permanent --zone="$zone" --remove-"$option"="$entry"; done
          done
          firewall-cmd --permanent --zone="$zone" --list-rich-rules > "$work/previous"
          while IFS= read -r rule; do
            [ -n "$rule" ] || continue
            firewall-cmd --permanent --zone="$zone" --remove-rich-rule="$rule"
          done < "$work/previous"
          add_rule() {
            firewall-cmd --permanent --zone="$zone" --add-rich-rule="$1"
          }
          for family in ipv4 ipv6; do
            for source in ${sources:-any}; do
              address=
              if [ "$source" != any ]; then
                case "$family:$source" in ipv4:*:*) continue ;; ipv6:*:*) ;; ipv6:*) continue ;; esac
                address=" source address=\"$source\""
              fi
              add_rule "rule family=\"$family\" priority=\"-100\"$address port port=\"$ssh\" protocol=\"tcp\" accept"
            done
            add_rule "rule family=\"$family\" priority=\"-90\" port port=\"$ssh\" protocol=\"tcp\" drop"
          done
          for entry in $ports; do firewall-cmd --permanent --zone="$zone" --add-port="$entry"; done
          firewall-cmd --permanent --zone="$zone" --set-target=default
        done < "$work/zones"
        firewall-cmd --reload
        while IFS= read -r zone; do firewall-cmd --zone="$zone" --list-all; done < "$work/zones"
      fi
  - name: Copy terminal definition
    packages: *install_packages
    available_command: command -v ssh && command -v infocmp && test -n "${TERM:-}"
    # Export before connecting so a failed infocmp cannot send a partial definition.
    command: sh -c %{export_script} -- %h %p %{ensure_remote} %{remote}
    export_script: |
      set -eu
      port=$2
      definition=$(infocmp -x -- "$TERM")
      # Keep installation/password prompts on the terminal, not definition stdin.
      ssh ${port:+-p "$port"} -tt -- "$1" "$3"
      printf '%s\n' "$definition" | ssh ${port:+-p "$port"} -- "$1" "$4"
    ensure_remote: sh -c %{ensure_tic} -- %{packages}
    ensure_tic: |
      set -eu
      command -v tic >/dev/null 2>&1 && exit 0
      root() { if [ "$(id -u)" = 0 ]; then "$@"; else sudo "$@"; fi; }
      . /etc/os-release
      case " $ID ${ID_LIKE:-} " in
        *' debian '*|*' ubuntu '*) root sh -c "$1" -- ncurses-bin ;;
        *' suse '*|*' opensuse-tumbleweed '*) root sh -c "$1" -- ncurses-devel ;;
        *' fedora '*|*' rhel '*|*' rocky '*|*' arch '*|*' alpine '*) root sh -c "$1" -- ncurses ;;
        *) echo "No supported tic package installer for $ID" >&2; exit 1 ;;
      esac
    remote: sh -c %{script}
    script: |
      set -eu
      umask 077
      source=$(mktemp "${TMPDIR:-/tmp}/shui-terminfo.XXXXXX")
      trap 'rm -f "$source"' 0
      trap 'exit 1' HUP INT TERM
      cat > "$source"
      mkdir -p "$HOME/.terminfo"
      tic -x -o "$HOME/.terminfo" "$source"
