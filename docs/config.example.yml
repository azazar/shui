# $XDG_CONFIG_HOME/shui.yml (default: ~/.config/shui.yml)
# F9 edits this file and validates/reloads it after saving. Existing files are
# never overwritten on upgrade; merge desired profiles/recipes from the defaults.
# Commands and scripts are trusted shell code. Checks and generators run locally.
#
# Profile fields: name (unique), command (required), key, available_command,
# prepare_command, inputs, shell, prepare_shell, port_args, and arbitrary string
# fields referenced by %{field}. Windows overrides use direct commands/PowerShell.
# default names a profile. Left/Right changes only the selected host's profile.
#
# Templates: %h = user@host; %p = explicit port or empty; %t = user@host[:port];
# %{field} = another string field; %{input:id} = dialog value; %% = literal %.
# Substitutions are shell-escaped: leave placeholders UNQUOTED. A remote command
# needs a quoting layer at each shell boundary; see remote/script fields below.
# Fields without %{...} references stay literal (including shell expressions).
# Optional-port templates preserve SSH alias settings when no port was entered.
#
# Profile key: Ctrl+, Alt+, or Ctrl+Alt+ plus A-Z. Plain text remains filter input.
# Keys must not duplicate another profile or a menu action, even if unavailable.
# Ctrl+H/I/J/M/S/Z are reserved for terminal aliases and flow/suspend behavior.
# Setup recipes cannot define keys. Ctrl+Q has no built-in action.
#
# available_command: quick, noninteractive local sh -c check, without placeholders.
# Exit 0 keeps the entry; other statuses hide it. Profile checks run at load/reload;
# setup checks run when F4 opens. No check means always available. Output is ignored.
# Checks time out after five seconds; input generators have the same timeout
# and a 64 KiB limit on each output stream. They have no controlling terminal
# on Unix, so prompts cannot interfere with the menu.
# These checks do not test remote connectivity or remote tool availability.
# Shipped profiles only launch their named tool; install missing tools separately.
# prepare_command runs locally with the terminal restored, before setup/connect/history.
# Exit 0 continues; any failure/cancellation returns to the menu. It supports %h,
# %p, %t and named fields, but not dialog inputs. It is only for launch profiles.
default: SSH
# auto: show usernames only to distinguish accounts for the same host/port.
# always: show known usernames; never: hide the username column.
# This affects display only. Matching configured usernames are omitted in commands.
username_display: auto
# Omitted keybindings use the built-in defaults. See config.optional.yml for
# editable bindings and custom profiles/recipes, all tested as active YAML.

profiles:
  - name: SSH
    available_command: command -v ssh
    key: Alt+S
    command: port=%p; exec ssh ${port:+-p "$port"} -- %h
  - name: Mosh
    available_command: command -v ssh && command -v mosh
    key: Alt+M
    command: port=%p; exec mosh ${port:+--ssh="ssh -p $port"} -- %h
  - name: MC
    available_command: command -v ssh && command -v mc
    key: Alt+C
    command: mc /sh://%t/
  - name: Bash
    available_command: command -v ssh
    key: Alt+B
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: exec bash -l
  - name: Zellij
    available_command: command -v ssh
    key: Alt+Z
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: exec zellij attach --create options --show-startup-tips false --show-release-notes false

  # Persistent sessions, file transfers, monitoring and SSH forwarding.
  - name: Tmux
    available_command: command -v ssh
    key: Alt+T
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: tmux attach-session || exec tmux new-session
  - name: SFTP
    available_command: command -v sftp
    key: Alt+F
    command: port=%p; exec sftp ${port:+-P "$port"} -- %h
  - name: Monitor
    available_command: command -v ssh
    key: Alt+H
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: exec btop
  - name: Tunnel
    available_command: command -v ssh
    key: Ctrl+Alt+L
    inputs:
      - id: forward
        type: promptString
        description: Forward (8080:localhost:80; IPv6 host in brackets)
        pattern: '(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]):(?:[A-Za-z0-9_.-]+|\[[0-9A-Fa-f:]+\]):(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])'
        validation_message: Use local-port:host:remote-port; ports must be 1-65535
        default: '8080:localhost:80'
        required: true
    # The destination is reached from the SSH server; listen only on loopback.
    command: |
      port=%p
      forward=%{input:forward}
      printf 'Forwarding 127.0.0.1:%s through SSH. Ctrl+C stops the tunnel.\n' "$forward"
      exec ssh ${port:+-p "$port"} -N -T -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -L "127.0.0.1:$forward" -- %h
  - name: SOCKS
    available_command: command -v ssh
    key: Ctrl+Alt+D
    inputs:
      - id: port
        type: promptString
        description: Local SOCKS port (1-65535)
        pattern: '(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])'
        validation_message: Enter a port number from 1 to 65535
        default: '1080'
        required: true
    command: |
      port=%p
      listen=%{input:port}
      printf 'SOCKS proxy on 127.0.0.1:%s. Ctrl+C stops the proxy.\n' "$listen"
      exec ssh ${port:+-p "$port"} -N -T -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -D "127.0.0.1:$listen" -- %h

  # Alternative clients use their own settings, not OpenSSH's ~/.ssh/config.
  # Use a real hostname/address (or a PuTTY saved session) and explicit user/port.
  - name: Dropbear
    key: Alt+D
    available_command: command -v dbclient
    command: port=%p; exec dbclient ${port:+-p "$port"} -- %h

# F4 configures the selected host; Shift+F4 opens Add new to add and connect.
# You can also switch between these modes using the Action field.
# Configure host runs setup and returns to the menu without saving history.
# Space toggles recipe checkboxes. All checked recipes show their inputs together.
# Enter runs checked recipes in config order, stopping on failure.
# None is selected by default; a recipe is required only in Configure host mode.
# Same command templates and named fields as launch profiles; runs locally.
configuration_scripts:
  - name: Configure key-based auth
    inputs:
      - &ssh_key
        id: key
        type: pickString
        description: SSH keypair
        required: true
        # Emit YAML. Only list public keys with a matching private-key file.
        command: |
          found=0
          printf 'options:\n'
          for public in "$HOME"/.ssh/id_*.pub; do
            [ -f "$public" ] && [ -f "${public%.pub}" ] || continue
            name=${public##*/}
            escaped=$(printf '%s' "$name" | sed "s/'/''/g")
            printf "  - '%s'\n" "$escaped"
            found=1
          done
          [ "$found" = 1 ] || printf "  - 'Generate new Ed25519 key'\n"
      - &ssh_key_expiry
        id: expiry
        type: pickString
        description: Key expiry
        options: [never, 8 hours, day, week, month, year]
        default: never
        # Durations start on the server after ssh-copy-id: month = 30 days,
        # year = 365 days. UTC avoids local time-zone / daylight-saving ambiguity.
        # never removes expiry-time from this key; it does not remove other options.
    command: sh -c %{setup_script} -- %h %p %{prepare_key} %{input:key} %{expiry_remote}
    setup_script: |
      set -eu
      host=$1
      port=$2
      key=$(sh -c "$3" -- "$4")
      ssh-copy-id ${port:+-p "$port"} -i "$key" "$host"
      cat "$key" | ssh ${port:+-p "$port"} -i "${key%.pub}" -- "$host" "$5"
    expiry_remote: &ssh_key_expiry_remote sh -c %{set_expiry} -- %{input:expiry}
    # Update every occurrence of the selected key in the standard authorized_keys.
    # Preserve other keys, comments, and options (including quoted commas/spaces).
    # Custom AuthorizedKeysFile/Command layouts need a custom recipe.
    set_expiry: &set_ssh_key_expiry |
      set -eu
      case "$1" in
        never) seconds=0 ;;
        '8 hours') seconds=28800 ;;
        day) seconds=86400 ;;
        week) seconds=604800 ;;
        month) seconds=2592000 ;;
        year) seconds=31536000 ;;
        *) echo 'Unknown key expiry.' >&2; exit 1 ;;
      esac
      expiry=
      if [ "$seconds" -ne 0 ]; then
        deadline=$(( $(date +%s) + seconds ))
        expiry=$(date -u -d "@$deadline" +%Y%m%d%H%M%SZ 2>/dev/null) ||
          expiry=$(date -u -r "$deadline" +%Y%m%d%H%M%SZ)
      fi
      read -r key_type key_blob comment || :
      [ -n "$key_type" ] && [ -n "$key_blob" ] || exit 1
      file="$HOME/.ssh/authorized_keys"
      [ -f "$file" ] && [ ! -L "$file" ] || {
        echo 'Expected a regular ~/.ssh/authorized_keys file.' >&2; exit 1;
      }
      umask 077
      work=$(mktemp -d "$HOME/.ssh/.shui-expiry.XXXXXX")
      trap 'rm -rf "$work"' 0
      trap 'exit 1' HUP INT TERM
      cp "$file" "$work/original"
      awk -v key_type="$key_type" -v key_blob="$key_blob" -v expiry="$expiry" '
        # Find a separator outside double quotes, respecting backslash escapes.
        function boundary(s, commas,    i,c,quoted,escaped) {
          for (i=1; i<=length(s); i++) {
            c=substr(s,i,1)
            if (escaped) { escaped=0; continue }
            if (c=="\\") { escaped=1; continue }
            if (c=="\"") { quoted=!quoted; continue }
            if (!quoted && (commas ? c=="," : c ~ /[ \t]/)) return i
          }
          return length(s)+1
        }
        function token(    n,t) {
          sub(/^[ \t]+/, "", rest)
          n=boundary(rest,0); t=substr(rest,1,n-1)
          rest=substr(rest,n); return t
        }
        /^[ \t]*(#|$)/ { print; next }
        {
          original=$0; rest=$0; options=""; kind=token()
          if (kind!=key_type) { options=kind; kind=token() }
          blob=token()
          if (kind!=key_type || blob!=key_blob) { print original; next }
          found=1; kept=""
          while (length(options)) {
            n=boundary(options,1); option=substr(options,1,n-1)
            options=substr(options,n+1)
            if (option !~ /^expiry-time=/)
              kept=kept (length(kept) ? "," : "") option
          }
          if (length(expiry)) kept=kept (length(kept) ? "," : "") "expiry-time=\"" expiry "\""
          print (length(kept) ? kept " " : "") kind " " blob rest
        }
        END { if (!found) exit 1 }
      ' "$work/original" > "$work/updated" || {
        echo 'Could not find the installed key in ~/.ssh/authorized_keys.' >&2; exit 1;
      }
      cmp -s "$file" "$work/original" || {
        echo 'authorized_keys changed during setup; retry.' >&2; exit 1;
      }
      chmod 600 "$work/updated"
      mv "$work/updated" "$file"
      printf 'Key expiry: %s%s\n' "$1" "${expiry:+ ($expiry UTC)}"
    # Only runs after confirming setup, with the terminal restored for prompts.
    prepare_key: &prepare_ssh_key |
      set -eu
      if [ "$1" = 'Generate new Ed25519 key' ]; then
        private="$HOME/.ssh/id_ed25519"
        for file in "$private" "$private.pub"; do
          if [ -e "$file" ] || [ -L "$file" ]; then
            echo "Cannot generate a new key: $file already exists. Restore the matching key file or select another keypair." >&2
            exit 1
          fi
        done
        umask 077
        mkdir -p "$HOME/.ssh"
        echo "Generating $private (ssh-keygen will ask for a passphrase)." >&2
        ssh-keygen -q -t ed25519 -f "$private" >&2
        public="$private.pub"
      else
        public="$HOME/.ssh/$1"
      fi
      [ -f "$public" ] && [ -f "${public%.pub}" ] || {
        echo "Missing SSH keypair: $public" >&2
        exit 1
      }
      printf '%s\n' "$public"
  - name: Install dotfiles
    # Relative source paths are resolved under local $HOME.
    inputs:
      - id: source
        type: promptString
        description: Local directory (absolute or relative to home)
        default: src/dotfiles
        required: true
      - id: installer
        type: promptString
        description: Installer path relative to dotfiles directory
        default: install.sh
        required: true
      - id: shell
        type: pickString
        description: Installer shell
        options: [sh, bash]
        default: sh
    command: sh -c %{setup_script} -- %h %p %{input:source} %{input:installer} %{remote}
    setup_script: |
      set -eu
      host=$1
      port=$2
      source=$3
      installer=$4
      case "$source" in /*) ;; *) source="$HOME/$source" ;; esac
      test -f "$source/$installer" || { echo "Missing $source/$installer" >&2; exit 1; }
      ssh ${port:+-p "$port"} -- "$host" 'mkdir -p "$HOME/src/dotfiles"'
      scp ${port:+-P "$port"} -r "$source/." "$host:src/dotfiles/"
      ssh ${port:+-p "$port"} -tt -- "$host" "$5"
    remote: sh -c %{script} -- %{input:installer} %{input:shell}
    script: |
      set -eu
      if ! command -v "$2" >/dev/null; then
        case "$2" in bash) ;; *) echo 'Unsupported installer shell.' >&2; exit 1 ;; esac
        root() { if [ "$(id -u)" = 0 ]; then "$@"; else sudo "$@"; fi; }
        . /etc/os-release
        case " $ID ${ID_LIKE:-} " in
          *' debian '*|*' ubuntu '*) root apt-get update; root env DEBIAN_FRONTEND=noninteractive apt-get install -y bash ;;
          *' fedora '*|*' rhel '*|*' rocky '*) root dnf install -y bash ;;
          *' suse '*|*' opensuse-tumbleweed '*) root zypper --non-interactive install bash ;;
          *' arch '*) root pacman -S --needed --noconfirm bash ;;
          *' alpine '*) root apk add bash ;;
          *) echo "No supported shell package installer for $ID" >&2; exit 1 ;;
        esac
      fi
      cd "$HOME/src/dotfiles"
      exec "$2" "./$1"
  - name: Configure passwordless sudo
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{elevate} -- %{script} %{install_sudo}
    elevate: &sudo_elevate |
      set -eu
      script=$1
      shift
      if [ "$(id -u)" = 0 ]; then
        exec sh -c "$script" -- "$@"
      fi
      command -v sudo >/dev/null 2>&1 || {
        echo 'Install sudo or connect as root to configure this host.' >&2
        exit 1
      }
      exec sudo sh -c "$script" -- "$@"
    install_sudo: &install_sudo |
      set -eu
      if command -v sudo >/dev/null && command -v visudo >/dev/null; then exit 0; fi
      . /etc/os-release
      case " $ID ${ID_LIKE:-} " in
        *' debian '*|*' ubuntu '*) apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y sudo ;;
        *' fedora '*|*' rhel '*|*' rocky '*) dnf install -y sudo ;;
        *' suse '*|*' opensuse-tumbleweed '*) zypper --non-interactive install sudo ;;
        *' arch '*) pacman -S --needed --noconfirm sudo ;;
        *' alpine '*) apk add sudo ;;
        *) echo "No supported sudo package installer for $ID" >&2; exit 1 ;;
      esac
      command -v sudo >/dev/null && command -v visudo >/dev/null
    script: |
      set -eu
      . /etc/os-release
      case " $ID ${ID_LIKE:-} " in
        *' debian '*|*' ubuntu '*) group=sudo ;;
        *' fedora '*|*' rhel '*|*' rocky '*|*' alpine '*|*' arch '*|*' suse '*|*' opensuse-tumbleweed '*) group=wheel ;;
        *) echo "Unsupported administrative group for $ID" >&2; exit 1 ;;
      esac
      sh -c "$1"
      if ! getent group "$group" >/dev/null; then
        if command -v groupadd >/dev/null; then groupadd "$group"; else addgroup -S "$group"; fi
      fi
      mkdir -p /etc/sudoers.d
      work=$(mktemp -d /etc/sudoers.d/.shui-nopasswd.XXXXXX)
      trap 'rm -rf "$work"' 0
      trap 'exit 1' HUP INT TERM
      printf '%%%s ALL=(ALL:ALL) NOPASSWD: ALL\n' "$group" > "$work/nopasswd"
      chmod 0440 "$work/nopasswd"
      visudo -cf "$work/nopasswd"
      test ! -L /etc/sudoers.d/nopasswd || {
        echo 'Refusing symlinked /etc/sudoers.d/nopasswd' >&2; exit 1;
      }
      if [ -f /etc/sudoers.d/nopasswd ]; then
        cp -p /etc/sudoers.d/nopasswd "$work/original"
      fi
      mv "$work/nopasswd" /etc/sudoers.d/nopasswd
      if ! visudo -c; then
        if [ -f "$work/original" ]; then
          mv "$work/original" /etc/sudoers.d/nopasswd
        else
          rm -f /etc/sudoers.d/nopasswd
        fi
        exit 1
      fi
      printf 'Passwordless sudo configured for group %s.\n' "$group"
  - name: Configure SSH-agent sudo
    install_sudo: *install_sudo
    command: port=%p; exec ssh ${port:+-p "$port"} -A -tt -- %h %{remote}
    remote: sh -c %{prepare} -- %{script} %{install_sudo}
    prepare: |
      set -eu
      test -n "${SSH_AUTH_SOCK:-}" || {
        echo 'Forward an SSH agent containing your authentication key (ssh -A).' >&2; exit 1;
      }
      keys=$(ssh-add -L) || { echo 'The forwarded agent has no usable keys.' >&2; exit 1; }
      user=$(id -un)
      if [ "$(id -u)" = 0 ]; then
        exec sh -c "$1" -- "$user" "$keys" "$2"
      fi
      exec sudo sh -c "$1" -- "$user" "$keys" "$2"
    script: |
      set -eu
      user=$1
      keys=$2
      case "$user" in ''|*[!a-zA-Z0-9_-]*) echo 'Unsupported login username.' >&2; exit 1 ;; esac
      sh -c "$3"
      . /etc/os-release
      module=
      find_module() {
        for path in /usr/lib/security/pam_ssh_agent_auth.so /usr/lib64/security/pam_ssh_agent_auth.so /lib/security/pam_ssh_agent_auth.so /lib64/security/pam_ssh_agent_auth.so /usr/lib/*-linux-gnu/security/pam_ssh_agent_auth.so /lib/*-linux-gnu/security/pam_ssh_agent_auth.so; do
          if [ -f "$path" ]; then module=$path; return 0; fi
        done
        return 1
      }
      if ! find_module; then
        case " $ID ${ID_LIKE:-} " in
          *' debian '*|*' ubuntu '*)
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y libpam-ssh-agent-auth ;;
          *' fedora '*|*' rhel '*|*' rocky '*) dnf install -y pam_ssh_agent_auth ;;
          *' suse '*|*' opensuse-tumbleweed '*) zypper --non-interactive install pam_ssh_agent_auth ;;
          *' arch '*) pacman -S --needed --noconfirm pam-ssh-agent-auth ;;
          *' alpine '*) apk add pam-ssh-agent-auth ;;
          *) echo "No supported package installer for $ID" >&2; exit 1 ;;
        esac
        find_module || { echo 'pam_ssh_agent_auth is not available from the enabled repositories.' >&2; exit 1; }
      fi
      command -v visudo >/dev/null
      test -f /etc/pam.d/sudo || test -f /usr/lib/pam.d/sudo || { echo 'A PAM-enabled sudo installation is required.' >&2; exit 1; }
      # Keep keys root-owned, independent of the user's SSH login authorized_keys.
      directory=/etc/security/ssh-agent-sudo
      test ! -L "$directory" || { echo 'Refusing symlinked key directory.' >&2; exit 1; }
      mkdir -p "$directory" /etc/sudoers.d /etc/pam.d
      chmod 0755 "$directory"
      work=$(mktemp -d "$directory/.setup.XXXXXX")
      trap 'rm -rf "$work"' 0
      trap 'exit 1' HUP INT TERM
      printf '%s\n' "$keys" > "$work/keys"
      chmod 0644 "$work/keys"
      # PAM must authenticate the invoking user, including on distros whose
      # default sudo policy requests the target user's (usually root) password.
      printf 'Defaults:%s env_keep += "SSH_AUTH_SOCK"\nDefaults:%s !targetpw, !rootpw, !runaspw\n' "$user" "$user" > "$work/sudoers"
      chmod 0440 "$work/sudoers"
      visudo -cf "$work/sudoers"
      for file in /etc/pam.d/sudo /etc/pam.d/sudo-i; do
        name=${file##*/}
        source=$file
        if [ ! -e "$source" ] && [ ! -L "$source" ]; then source=/usr/lib/pam.d/$name; fi
        [ -e "$source" ] || continue
        test -f "$source" && test ! -L "$source" || {
          echo "Refusing non-regular PAM file: $file" >&2; exit 1;
        }
        cp -p "$source" "$work/$name.original"
        {
          printf 'auth sufficient %s file=/etc/security/ssh-agent-sudo/%%u # shui-agent-sudo\n' "$module"
          sed '/# shui-agent-sudo$/d' "$source"
        } > "$work/$name"
        chmod 0644 "$work/$name"
      done
      fragment=/etc/sudoers.d/ssh-agent-auth-$user
      test ! -L "$directory/$user" && test ! -L "$fragment" || {
        echo 'Refusing symlinked agent-auth configuration.' >&2; exit 1;
      }
      if [ -f "$fragment" ]; then
        cp -p "$fragment" "$work/sudoers.original"
      fi
      mv "$work/sudoers" "$fragment"
      if ! visudo -c; then
        if [ -f "$work/sudoers.original" ]; then
          mv "$work/sudoers.original" "$fragment"
        else
          rm -f "$fragment"
        fi
        exit 1
      fi
      mv "$work/keys" "$directory/$user"
      for name in sudo sudo-i; do
        [ -f "$work/$name" ] || continue
        if [ ! -e "/etc/pam.d/$name.shui-backup" ] && [ ! -L "/etc/pam.d/$name.shui-backup" ]; then
          cp -p "$work/$name.original" "/etc/pam.d/$name.shui-backup"
        fi
        mv "$work/$name" "/etc/pam.d/$name"
      done
      printf 'SSH-agent sudo configured for %s. Use agent forwarding on future connections.\n' "$user"
  - name: Configure automatic security updates
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{elevate} -- %{script}
    elevate: &recipe_elevate |
      set -eu
      script=$1
      shift
      if [ "$(id -u)" = 0 ]; then exec sh -c "$script" -- "$@"; fi
      exec sudo sh -c "$script" -- "$@"
    script: |
      set -eu
      . /etc/os-release
      case "$ID" in
        debian|ubuntu) installer=apt ;;
        fedora|rhel|rocky|almalinux) installer=dnf ;;
        opensuse-leap|sles) installer=zypper ;;
        *) echo "Security-only automatic updates are unsupported on $ID." >&2; exit 1 ;;
      esac
      test -d /run/systemd/system && command -v systemctl >/dev/null || {
        echo 'Automatic security updates require a running systemd host.' >&2; exit 1;
      }
      case "$installer" in
        apt)
          if ! command -v unattended-upgrade >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y unattended-upgrades
          fi
          # Clear inherited origin lists so only security pockets are eligible.
          cat > /etc/apt/apt.conf.d/52shui-security-updates <<'EOF'
      #clear Unattended-Upgrade::Allowed-Origins;
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Origins-Pattern {
        "origin=${distro_id},codename=${distro_codename}-security";
        "origin=${distro_id}ESMApps,suite=${distro_codename}-apps-security";
        "origin=${distro_id}ESM,suite=${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
      EOF
          update=/usr/bin/unattended-upgrade
          refresh='ExecStartPre=/usr/bin/apt-get update'
          ;;
        dnf)
          command -v dnf >/dev/null
          update='/usr/bin/dnf -y upgrade --security'
          refresh=
          ;;
        zypper)
          command -v zypper >/dev/null
          update='/usr/bin/zypper --non-interactive patch --category security'
          refresh='ExecStartPre=/usr/bin/zypper --non-interactive refresh'
          ;;
      esac
      mkdir -p /etc/systemd/system
      cat > /etc/systemd/system/shui-security-updates.service <<EOF
      [Unit]
      Description=Shui automatic security updates
      Wants=network-online.target
      After=network-online.target
      [Service]
      Type=oneshot
      $refresh
      ExecStart=$update
      EOF
      cat > /etc/systemd/system/shui-security-updates.timer <<'EOF'
      [Unit]
      Description=Daily security updates
      [Timer]
      OnCalendar=daily
      RandomizedDelaySec=1h
      Persistent=true
      [Install]
      WantedBy=timers.target
      EOF
      systemctl daemon-reload
      systemctl enable --now shui-security-updates.timer
      systemctl is-active --quiet shui-security-updates.timer
      echo 'Daily security-only updates enabled; automatic reboot is disabled.'
  - name: Install Docker / Podman
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{elevate} -- %{script} %{input:engine}
    elevate: *recipe_elevate
    inputs:
      - id: engine
        type: pickString
        description: Container engine
        options: [Docker, Podman]
        default: Docker
    script: |
      set -eu
      case "$1" in Docker) engine=docker ;; Podman) engine=podman ;; *) echo 'Invalid container engine.' >&2; exit 1 ;; esac
      . /etc/os-release
      if [ "$engine" = docker ]; then
        test -d /run/systemd/system || command -v rc-service >/dev/null || {
          echo 'Docker requires systemd or OpenRC to manage its daemon.' >&2; exit 1;
        }
      fi
      case " $ID ${ID_LIKE:-} " in
        *' debian '*|*' ubuntu '*)
          package=$engine
          [ "$engine" != docker ] || package=docker.io
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y "$package" ;;
        *' fedora '*|*' rhel '*|*' rocky '*)
          package=$engine
          [ "$engine" != docker ] || package=moby-engine
          dnf install -y "$package" ;;
        *' suse '*|*' opensuse-tumbleweed '*) zypper --non-interactive install "$engine" ;;
        *' arch '*) pacman -S --needed --noconfirm "$engine" ;;
        *' alpine '*)
          apk add "$engine"
          [ "$engine" != docker ] || apk add docker-openrc ;;
        *) echo "Unsupported container package installer for $ID." >&2; exit 1 ;;
      esac
      if [ "$engine" = docker ]; then
        if [ -d /run/systemd/system ]; then
          systemctl enable --now docker
        else
          rc-update add docker default
          rc-service docker start
        fi
        docker info
      else
        podman info
      fi
  - name: Configure log limits and cleanup
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{elevate} -- %{bootstrap} %{bootstrap} %{maintenance} %{input:disk} %{input:runtime} %{input:days} %{input:file_size} %{input:backups} %{input:cleanup} %{input:caches} %{input:guests} %{input:depth}
    elevate: *recipe_elevate
    inputs:
      - {id: disk, type: promptString, description: 'Disk journal cap (bytes or K/M/G/T; e.g. 512M)', default: 512M, required: true, pattern: &log_size_pattern '[1-9][0-9]*[KMGT]?', validation_message: &log_size_hint 'Use positive bytes or an uppercase K/M/G/T suffix, e.g. 512M'}
      - {id: runtime, type: promptString, description: 'Runtime journal cap (bytes or K/M/G/T; e.g. 128M)', default: 128M, required: true, pattern: *log_size_pattern, validation_message: *log_size_hint}
      - {id: days, type: promptString, description: Retention in days (1-36500), default: '30', required: true, pattern: '(?:[1-9][0-9]{0,3}|[12][0-9]{4}|3[0-5][0-9]{3}|36[0-4][0-9]{2}|36500)', validation_message: Enter whole days from 1 to 36500}
      - {id: file_size, type: promptString, description: 'Per-log cap (bytes or K/M/G/T; e.g. 10M)', default: 10M, required: true, pattern: *log_size_pattern, validation_message: *log_size_hint}
      - {id: backups, type: promptString, description: Rotated files per log (1-100), default: '3', required: true, pattern: '(?:[1-9][0-9]?|100)', validation_message: Enter a whole number from 1 to 100}
      - id: cleanup
        type: pickString
        description: Cleanup mode
        options: [Enforce retention, Remove all archives and selected caches]
        default: Enforce retention
      - id: caches
        type: pickString
        description: Cache cleanup
        options: [None, Package caches, Login-user caches, All-user caches, Package and login-user caches, Package and all-user caches]
        default: None
      - id: guests
        type: pickString
        description: VM guest scope
        options: [Host only, Running guests recursively]
        default: Host only
      - {id: depth, type: promptString, description: Guest depth (0-5; 0 disables traversal), default: '2', required: true, pattern: '[0-5]', validation_message: Enter one digit from 0 to 5}
    bootstrap: |
      set -eu
      if ! command -v bash >/dev/null || ! command -v jq >/dev/null || ! command -v logrotate >/dev/null ||
         ! command -v timeout >/dev/null || ! find --version >/dev/null 2>&1; then
        . /etc/os-release
        case " $ID ${ID_LIKE:-} " in
          *' debian '*|*' ubuntu '*) apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y bash jq logrotate coreutils findutils ;;
          *' fedora '*|*' rhel '*|*' rocky '*) dnf install -y bash jq logrotate coreutils findutils ;;
          *' suse '*|*' opensuse-tumbleweed '*) zypper --non-interactive install bash jq logrotate coreutils findutils ;;
          *' arch '*) pacman -S --needed --noconfirm bash jq logrotate coreutils findutils ;;
          *' alpine '*) apk add bash jq logrotate coreutils findutils ;;
          *) echo 'Install Bash, jq, logrotate, coreutils and findutils first.' >&2; exit 1 ;;
        esac
      fi
      bootstrap=$1
      maintenance=$2
      shift 2
      exec timeout 600 bash -c "$maintenance" -- "$bootstrap" "$maintenance" "$@"
    maintenance: |
      set -euo pipefail
      bootstrap=$1
      source=$2
      shift 2
      options=("${@:1:9}")
      disk=$1 runtime=$2 days=$3 file_size=$4 backups=$5 cleanup=$6 caches=$7 guests=$8 depth=$9
      context='{"seen":[],"remaining":16}'
      if (( $# > 9 )); then context=${10}; fi
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      bytes() {
        [[ $1 =~ ^([1-9][0-9]*)([KMGT]?)$ ]] || fail 'Use positive bytes or a K/M/G/T suffix'
        number=${BASH_REMATCH[1]} suffix=${BASH_REMATCH[2]} factor=1
        case "$suffix" in K) factor=1024 ;; M) factor=1048576 ;; G) factor=1073741824 ;; T) factor=1099511627776 ;; esac
        (( ${#number} <= 18 )) && (( number <= 1152921504606846976 / factor )) || fail 'Log size is too large'
        echo "$((number * factor))"
      }
      bytes "$disk" >/dev/null
      bytes "$runtime" >/dev/null
      file_bytes=$(bytes "$file_size")
      [[ $days =~ ^[1-9][0-9]{0,4}$ ]] && (( days <= 36500 )) || fail 'Days must be 1-36500'
      [[ $backups =~ ^[1-9][0-9]{0,2}$ ]] && (( backups <= 100 )) || fail 'Backups must be 1-100'
      [[ $depth =~ ^[0-5]$ ]] || fail 'Guest depth must be 0-5'
      case "$cleanup" in 'Enforce retention') aggressive=0 ;; 'Remove all archives and selected caches') aggressive=1 ;; *) fail 'Invalid cleanup mode' ;; esac
      case "$caches" in None|'Package caches'|'Login-user caches'|'All-user caches'|'Package and login-user caches'|'Package and all-user caches') ;; *) fail 'Invalid cache scope' ;; esac
      case "$guests" in 'Host only'|'Running guests recursively') ;; *) fail 'Invalid guest scope' ;; esac
      umask 077
      work=$(mktemp -d)
      trap 'rm -rf -- "$work"' EXIT
      printf '%s\n' "$context" | jq -e '.remaining >= 0 and .remaining <= 16 and (.seen | type == "array")' >/dev/null
      printf '%s\n' "$context" > "$work/context"
      identity=$(cat /etc/machine-id 2>/dev/null || true)
      if [[ $identity =~ ^[0-9a-f]{32}$ ]]; then
        if jq -e --arg id "$identity" '.seen | index($id) != null' "$work/context" >/dev/null; then
          printf 'Skipping previously visited guest\nSHUI_LOG_RESULT=%s\n' "$(jq -c . "$work/context")"
          exit 0
        fi
        jq --arg id "$identity" '.seen += [$id]' "$work/context" > "$work/next"
        mv "$work/next" "$work/context"
      fi

      # Write beside the destination, validate, then atomically replace it.
      write_config() (
        set -e
        path=$1
        [[ ! -L $path ]] || fail "Refusing symlinked configuration: $path"
        mkdir -p -- "$(dirname "$path")"
        temporary=$(mktemp "${path}.shui.XXXXXX")
        trap 'rm -f -- "$temporary"' EXIT
        cat > "$temporary"
        if [[ -e $path ]]; then chmod --reference="$path" "$temporary"; else chmod 644 "$temporary"; fi
        if [[ $path == /etc/docker/daemon.json ]] && command -v dockerd >/dev/null; then
          dockerd --validate --config-file "$temporary"
        fi
        mv -- "$temporary" "$path"
      )
      journals() {
        if [[ ! -d /run/systemd/system ]] || ! command -v journalctl >/dev/null; then
          echo 'No running systemd journal; skipping journal limits'
          return
        fi
        printf '[Journal]\nSystemMaxUse=%s\nRuntimeMaxUse=%s\nMaxRetentionSec=%sday\n' "$disk" "$runtime" "$days" |
          write_config /etc/systemd/journald.conf.d/90-shui-limits.conf
        systemctl restart systemd-journald
        systemctl is-active --quiet systemd-journald
        journalctl --rotate
        if (( aggressive )); then
          journalctl --vacuum-size=1
        else
          for base in /var/log/journal /run/log/journal; do
            limit=$disk
            [[ $base != /run/log/journal ]] || limit=$runtime
            for directory in "$base"/*; do
              if [[ -d $directory && ! -L $directory ]]; then
                journalctl --directory="$directory" --vacuum-size="$limit" --vacuum-time="${days}days"
              fi
            done
          done
        fi
        journalctl --disk-usage
      }
      text_logs() {
        if [[ ! -e /etc/logrotate.conf ]]; then printf 'include /etc/logrotate.d\n' | write_config /etc/logrotate.conf; fi
        # Change global defaults only; keep service rules and rotation hooks.
        awk -v size="$file_bytes" -v backups="$backups" -v days="$days" '
          BEGIN { print "# BEGIN SHUI LIMITS\nmaxsize " size "\nrotate " backups "\nmaxage " days "\n# END SHUI LIMITS" }
          /^# BEGIN SHUI LIMITS$/ { managed=1; next }
          /^# END SHUI LIMITS$/ { managed=0; next }
          managed { next }
          depth == 0 && /^[[:space:]]*(maxsize|maxage|rotate)[[:space:]]/ { next }
          { print }
          /^[[:space:]]*(prerotate|postrotate|firstaction|lastaction|preremove)[[:space:]]*$/ { hook=1 }
          /^[[:space:]]*endscript[[:space:]]*$/ { hook=0; next }
          !hook && !/^[[:space:]]*#/ { line=$0; depth += gsub(/\{/, "", line) - gsub(/\}/, "", line) }
        ' /etc/logrotate.conf > "$work/logrotate"
        write_config /etc/logrotate.conf < "$work/logrotate"
        if [[ -d /run/systemd/system ]]; then
          systemctl enable --now logrotate.timer
        elif command -v rc-service >/dev/null; then
          rc-update add crond default
          rc-service crond start
        else
          echo 'WARNING: verify that cron runs logrotate on this host'
        fi
        logrotate /etc/logrotate.conf
      }
      container_logs() {
        if command -v docker >/dev/null; then
          config=/etc/docker/daemon.json
          if [[ -e $config ]]; then cat "$config" > "$work/docker"; else echo '{}' > "$work/docker"; fi
          driver=$(jq -r '."log-driver" // "json-file"' "$work/docker")
          case "$driver" in
            json-file|local)
              jq --arg driver "$driver" --arg size "$file_bytes" --arg count "$backups" '
                .["log-driver"] = $driver |
                .["log-opts"] = ((.["log-opts"] // {}) + {"max-size":$size,"max-file":$count})
              ' "$work/docker" | write_config "$config"
              echo 'WARNING: Restart Docker at a suitable time, then recreate existing containers to apply saved defaults; no workloads were restarted' ;;
            journald) ;;
            *) echo "WARNING: Docker driver $driver needs its own retention policy" ;;
          esac
        fi
        if command -v podman >/dev/null; then
          printf '[containers]\nlog_driver="k8s-file"\nlog_size_max=%s\n' "$file_bytes" |
            write_config /etc/containers/containers.conf.d/90-shui-logging.conf
          echo 'WARNING: Podman limits apply to new containers; existing containers require recreation and user overrides may take precedence'
        fi
      }
      libvirt_logs() {
        [[ -d /etc/libvirt ]] || return 0
        config=/etc/libvirt/virtlogd.conf
        if [[ -e $config ]]; then
          sed '/^[[:space:]]*max_size[[:space:]]*=/d; /^[[:space:]]*max_backups[[:space:]]*=/d' "$config" > "$work/virtlogd"
        else : > "$work/virtlogd"; fi
        printf '\nmax_size = %s\nmax_backups = %s\n' "$file_bytes" "$backups" >> "$work/virtlogd"
        write_config "$config" < "$work/virtlogd"
        if [[ -d /run/systemd/system ]] && systemctl is-active --quiet virtlogd; then
          # Re-exec preserves VM log descriptors; do not restart VMs.
          systemctl kill --kill-whom=main --signal=SIGUSR1 virtlogd
        else echo 'WARNING: virtlogd limits take effect when it next starts'; fi
      }
      archives() {
        # GNU find -execdir holds the containing directory open. Delete only
        # basenames from that directory, never through user-controlled parents.
        archive_cleanup=$(cat <<'SH'
      set -euo pipefail
      backups=$1 cutoff=$2 aggressive=$3
      stems=() counts=()
      find -P . -maxdepth 1 -type f -printf '%T@ %p\0' | sort -z -nr |
      while IFS= read -r -d '' record; do
        modified=${record%% *} file=${record#* }
        [[ $file =~ ^(.+)(\.[1-9][0-9]*|-[0-9]{8})(\.(gz|xz|bz2|zst))?$ ]] || continue
        stem=${BASH_REMATCH[1]}
        index=0
        while (( index < ${#stems[@]} )) && [[ ${stems[index]} != "$stem" ]]; do index=$((index + 1)); done
        stems[index]=$stem
        count=${counts[index]:-0}
        counts[index]=$((count + 1))
        if (( aggressive || count >= backups || ${modified%%.*} < cutoff )); then rm -f -- "$file"; fi
      done
      SH
        )
        cutoff=$(( $(date +%s) - days * 86400 ))
        find -P /var/log -regextype posix-extended -ignore_readdir_race -name journal -prune -o \
          -type f -regex '.*(\.[1-9][0-9]*|-[0-9]{8})(\.(gz|xz|bz2|zst))?' \
          -execdir bash -c "$archive_cleanup" -- "$backups" "$cutoff" "$aggressive" {} +
        echo 'Archive cleanup finished; active and engine-owned container logs are preserved'
      }
      cache_cleanup() {
        [[ $caches != None ]] || return 0
        if [[ $caches == Package* ]]; then
          if command -v apt-get >/dev/null; then
            if (( aggressive )); then apt-get clean; else apt-get autoclean; fi
          elif command -v dnf >/dev/null; then
            if (( aggressive )); then dnf clean all; else dnf clean packages; fi
          elif command -v zypper >/dev/null; then
            if (( aggressive )); then zypper --non-interactive clean --all; else zypper --non-interactive clean --packages; fi
          elif command -v pacman >/dev/null; then
            if (( aggressive )); then pacman -Scc --noconfirm; else pacman -Sc --noconfirm; fi
          elif command -v apk >/dev/null; then apk cache clean; fi
        fi
        [[ $caches != 'Package caches' ]] || return 0
        if [[ $caches == *all-user* || $caches == All-user* ]]; then
          awk -F: '$3 == 0 || ($3 >= 1000 && $3 < 65534)' /etc/passwd > "$work/users"
        else
          getent passwd "${SUDO_USER:-root}" > "$work/users"
        fi
        cache_script=$(cat <<'SH'
      set -euo pipefail
      cache=$1/.cache days=$2 aggressive=$3
      [[ ! -L $cache ]] || { echo "Refusing symlinked user cache: $cache" >&2; exit 1; }
      [[ -d $cache ]] || exit 0
      if (( aggressive )); then
        find -P "$cache" -mindepth 1 -type f -delete
      else
        find -P "$cache" -mindepth 1 -type f -mmin "+$((days * 1440))" -delete
      fi
      find -P "$cache" -depth -mindepth 1 -type d -empty -delete
      SH
        )
        while IFS=: read -r user _password uid _gid _comment home _shell; do
          [[ -d $home ]] || continue
          # Drop privileges before touching any user-controlled cache paths.
          if [[ $uid == 0 ]]; then
            bash -c "$cache_script" -- "$home" "$days" "$aggressive"
          elif command -v runuser >/dev/null; then
            runuser -u "$user" -- bash -c "$cache_script" -- "$home" "$days" "$aggressive"
          else
            printf -v command '%q ' bash -c "$cache_script" -- "$home" "$days" "$aggressive"
            su -s /bin/bash -c "$command" "$user"
          fi
        done < "$work/users"
      }
      guest_logs() {
        [[ $guests != 'Host only' && $depth != 0 ]] || return 0
        if ! command -v virsh >/dev/null; then echo 'No libvirt client; skipping guest traversal'; return; fi
        virsh -c qemu:///system list --state-running --uuid > "$work/domains"
        child=("${options[@]}")
        child[8]=$((depth - 1))
        uncertain_guest() {
          # Unknown child progress must not let ancestors reuse its guest budget.
          jq '.remaining = 0' "$work/context" > "$work/next"
          mv "$work/next" "$work/context"
          fail "$*"
        }
        failed=0
        while IFS= read -r domain; do
          [[ -n $domain ]] || continue
          remaining=$(jq -r '.remaining' "$work/context")
          (( remaining > 0 )) || fail 'Reached the 16-guest traversal budget'
          jq '.remaining -= 1' "$work/context" > "$work/next"
          mv "$work/next" "$work/context"
          agent() { virsh -c qemu:///system qemu-agent-command "$domain" --timeout 15 "$1" | jq -e '.return'; }
          if ! agent '{"execute":"guest-ping"}' >/dev/null; then
            echo "FAILED: Guest $domain has no accessible agent" >&2
            failed=1
            continue
          fi
          request=$(jq -nc --args '{execute:"guest-exec",arguments:{path:"/bin/sh",arg:$ARGS.positional,"capture-output":true}}' \
            -- -c "$bootstrap" -- "$bootstrap" "$source" "${child[@]}" "$(cat "$work/context")")
          if ! pid=$(agent "$request" | jq -er '.pid'); then uncertain_guest "Guest $domain execution could not be confirmed"; fi
          request=$(jq -nc --argjson pid "$pid" '{execute:"guest-exec-status",arguments:{pid:$pid}}')
          end=$((SECONDS + 180))
          status='{}'
          while (( SECONDS < end )); do
            if ! status=$(agent "$request"); then break; fi
            if jq -e '.exited == true' <<< "$status" >/dev/null; then break; fi
            sleep 1
          done
          if ! jq -e '.exited == true' <<< "$status" >/dev/null; then
            uncertain_guest "Guest $domain execution timed out or status was lost; it may still be running"
          fi
          if ! jq -r '."out-data" // ""' <<< "$status" | base64 -d > "$work/output"; then
            uncertain_guest "Guest $domain returned invalid output"
          fi
          if ! jq -r '."err-data" // ""' <<< "$status" | base64 -d >&2; then
            uncertain_guest "Guest $domain returned invalid error output"
          fi
          printf 'Guest %s:\n' "$domain"
          cat "$work/output"
          returned=$(sed -n 's/^SHUI_LOG_RESULT=//p' "$work/output" | tail -n 1)
          if [[ -z $returned ]] || ! jq -e '.remaining >= 0 and .remaining <= 16 and (.seen | all(type == "string" and test("^[0-9a-f]{32}$")))' <<< "$returned" >/dev/null; then
            uncertain_guest "Guest $domain returned incomplete maintenance results"
          fi
          jq --argjson child "$returned" '.remaining = ([.remaining,$child.remaining] | min) | .seen = ((.seen + $child.seen) | unique | .[:32])' \
            "$work/context" > "$work/next"
          mv "$work/next" "$work/context"
          if ! jq -e '.exitcode == 0 and (."out-truncated" != true)' <<< "$status" >/dev/null; then failed=1; fi
        done < "$work/domains"
        return "$failed"
      }
      failures=0
      for action in journals text_logs container_logs libvirt_logs archives cache_cleanup guest_logs; do
        # A separate shell scope retains fail-fast behavior within each action,
        # while allowing the remaining independent actions to report outcomes.
        set +e
        ( set -e; "$action" )
        status=$?
        set -e
        if (( status == 0 )); then echo "OK: $action"; else echo "FAILED: $action" >&2; failures=$((failures + 1)); fi
      done
      printf 'SHUI_LOG_RESULT=%s\n' "$(jq -c . "$work/context")"
      (( failures == 0 )) || fail 'Incomplete log maintenance'
  - name: Configure firewall
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{prepare} -- %{script} %{firewall} %{input:ssh_ips} %{input:ports}
    prepare: |
      set -eu
      # Use the server-side SSH port, including SSH-config aliases and NAT.
      connection=${SSH_CONNECTION:-}
      test -n "$connection" || { echo 'Cannot determine the SSH server port.' >&2; exit 1; }
      port=${connection##* }
      script=$1
      shift
      if [ "$(id -u)" = 0 ]; then exec sh -c "$script" -- "$@" "$port"; fi
      exec sudo sh -c "$script" -- "$@" "$port"
    inputs:
      - id: ssh_ips
        type: promptString
        description: SSH IPs/CIDRs (space/comma separated; blank = any)
        default: ''
        pattern: '[ ]*(?:[0-9A-Fa-f:.]+(?:/[0-9]{1,3})?)(?:[ ,]+[0-9A-Fa-f:.]+(?:/[0-9]{1,3})?)*[ ]*'
        validation_message: 'Use IPs/CIDRs separated by spaces or commas, e.g. 192.0.2.1 2001:db8::/64; blank allows any'
      - id: ports
        type: promptString
        description: Extra ports (80/tcp 53/udp 8000-8010/tcp; space/comma)
        default: ''
        pattern: '[ ]*(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])(?:-(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?/(?:tcp|udp)(?:[ ,]+(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])(?:-(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?/(?:tcp|udp))*[ ]*'
        validation_message: 'Use port/tcp or port/udp (1-65535), optionally a range; separate entries with spaces or commas, or leave blank'
    script: |
      set -eu
      . /etc/os-release
      test -d /run/systemd/system || { echo 'This firewall recipe requires a running systemd host.' >&2; exit 1; }
      case " $ID ${ID_LIKE:-} " in
        *' debian '*|*' ubuntu '*)
          backend=ufw
          if systemctl is-active --quiet firewalld; then echo 'firewalld is already active; refusing to enable UFW alongside it.' >&2; exit 1; fi
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ufw jq iproute2 ;;
        *' fedora '*|*' rhel '*|*' rocky '*) backend=firewalld; dnf install -y firewalld jq iproute ;;
        *' suse '*|*' opensuse-tumbleweed '*) backend=firewalld; zypper --non-interactive install firewalld jq iproute2 ;;
        *' arch '*) backend=firewalld; pacman -S --needed --noconfirm firewalld jq iproute2 ;;
        *) echo "Unsupported firewall installer for $ID." >&2; exit 1 ;;
      esac
      exec sh -c "$1" -- "$backend" "$2" "$3" "$4"
    firewall: |
      set -eu
      set -f
      backend=$1 sources=$2 ports=$3 ssh=$4
      fail() { printf '%s\n' "$*" >&2; exit 1; }
      port_number() {
        case "$1" in ''|*[!0-9]*) return 1 ;; esac
        [ "${#1}" -le 5 ] && [ "$1" -ge 1 ] && [ "$1" -le 65535 ]
      }
      port_number "$ssh" || fail 'Invalid SSH port'
      sources=$(printf '%s\n' "$sources" | tr ',' ' ' | awk '{$1=$1; print}')
      ports=$(printf '%s\n' "$ports" | tr ',' ' ' | awk '{$1=$1; print}')
      # iproute2 validates numeric IPv4/IPv6 addresses and prefix lengths without
      # changing routes. Reject hostnames and shell syntax before invoking it.
      for source in $sources; do
        case "$source" in *[!0-9a-fA-F:./]*) fail "Invalid SSH source: $source" ;; esac
        case "$source" in
          *:*) ip -6 route show match "$source" >/dev/null || fail "Invalid SSH source: $source" ;;
          *) printf '%s\n' "$source" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(/[0-9]+)?$' || fail "Invalid SSH source: $source"
             ip -4 route show match "$source" >/dev/null || fail "Invalid SSH source: $source" ;;
        esac
      done
      for entry in $ports; do
        protocol=${entry##*/} range=${entry%/*}
        case "$protocol" in tcp|udp) ;; *) fail 'Ports require /tcp or /udp' ;; esac
        start=${range%-*} end=${range#*-}
        port_number "$start" && port_number "$end" && [ "$start" -le "$end" ] || fail 'Port range must be within 1-65535'
        if [ "$protocol" = tcp ] && [ "$start" -le "$ssh" ] && [ "$ssh" -le "$end" ]; then
          fail 'Configure SSH access with SSH allowed IPs, not additional ports'
        fi
      done
      umask 077
      work=$(mktemp -d)
      trap 'rm -rf -- "$work"' 0
      if [ "$backend" = ufw ]; then
        [ ! -L /etc/default/ufw ] || fail 'Refusing symlinked UFW configuration'
        sed -i 's/^IPV6=.*/IPV6=yes/' /etc/default/ufw
        grep -q '^IPV6=yes$' /etc/default/ufw || printf '\nIPV6=yes\n' >> /etc/default/ufw
        ufw show added > "$work/added"
        # Managed rules contain only numeric sources/ports and this fixed comment.
        # Split words as arguments, never eval firewall output as shell code.
        while IFS= read -r line; do
          case "$line" in
            *" comment 'shui-ssh'"|*" comment shui-ssh")
              line=${line% comment *}
              set -- $line
              [ "$1" = ufw ] || continue
              shift
              ufw --force delete "$@" comment shui-ssh ;;
          esac
        done < "$work/added"
        if [ -n "$sources" ]; then
          ufw prepend deny in proto tcp to any port "$ssh" comment shui-ssh
        fi
        for source in ${sources:-any}; do
          ufw prepend allow in proto tcp from "$source" to any port "$ssh" comment shui-ssh
        done
        for entry in $ports; do
          protocol=${entry##*/} range=${entry%/*}
          range=$(printf '%s' "$range" | tr '-' ':')
          ufw allow "$range/$protocol"
        done
        ufw default deny incoming
        ufw default allow outgoing
        ufw --force enable
        systemctl enable ufw
        ufw status verbose
      else
        if systemctl is-active --quiet ufw; then fail 'UFW is active; refusing to enable firewalld alongside it'; fi
        state=/var/lib/shui/firewall-ssh.json
        [ ! -L "$state" ] || fail 'Refusing symlinked firewall state'
        if [ -e "$state" ]; then cp "$state" "$work/state"; else echo '{}' > "$work/state"; fi
        jq -e 'type == "object" and all(.[]; type == "array" and all(.[]; type == "string"))' "$work/state" >/dev/null
        systemctl enable --now firewalld
        default=$(firewall-cmd --get-default-zone)
        active=$(firewall-cmd --get-active-zones)
        { printf '%s\n' "$default"; printf '%s\n' "$active" | awk 'NF && !/^[[:space:]]/ {print $1}'; } | sort -u > "$work/zones"
        while IFS= read -r zone; do
          jq -r --arg zone "$zone" '.[$zone][]?' "$work/state" > "$work/previous"
          while IFS= read -r rule; do
            if firewall-cmd --permanent --zone="$zone" --query-rich-rule="$rule" >/dev/null; then
              firewall-cmd --permanent --zone="$zone" --remove-rich-rule="$rule"
            fi
          done < "$work/previous"
          jq --arg zone "$zone" '.[$zone] = []' "$work/state" > "$work/next"
          mv "$work/next" "$work/state"
          add_rule() {
            firewall-cmd --permanent --zone="$zone" --add-rich-rule="$1"
            jq --arg zone "$zone" --arg rule "$1" '.[$zone] += [$rule]' "$work/state" > "$work/next"
            mv "$work/next" "$work/state"
          }
          for family in ipv4 ipv6; do
            for source in ${sources:-any}; do
              address=
              if [ "$source" != any ]; then
                case "$family:$source" in ipv4:*:*) continue ;; ipv6:*:*) ;; ipv6:*) continue ;; esac
                address=" source address=\"$source\""
              fi
              add_rule "rule family=\"$family\" priority=\"-100\"$address port port=\"$ssh\" protocol=\"tcp\" accept"
            done
            add_rule "rule family=\"$family\" priority=\"-90\" port port=\"$ssh\" protocol=\"tcp\" drop"
          done
          for entry in $ports; do firewall-cmd --permanent --zone="$zone" --add-port="$entry"; done
          firewall-cmd --permanent --zone="$zone" --set-target=default
        done < "$work/zones"
        mkdir -p /var/lib/shui
        cp "$work/state" "$state"
        firewall-cmd --reload
        while IFS= read -r zone; do firewall-cmd --zone="$zone" --list-all; done < "$work/zones"
      fi
  - name: Copy terminal definition
    available_command: command -v ssh && command -v infocmp && test -n "${TERM:-}"
    # Export before connecting so a failed infocmp cannot send a partial definition.
    command: sh -c %{export_script} -- %h %p %{ensure_remote} %{remote}
    export_script: |
      set -eu
      port=$2
      definition=$(infocmp -x -- "$TERM")
      # Keep installation/password prompts on the terminal, not definition stdin.
      ssh ${port:+-p "$port"} -tt -- "$1" "$3"
      printf '%s\n' "$definition" | ssh ${port:+-p "$port"} -- "$1" "$4"
    ensure_remote: sh -c %{ensure_tic}
    ensure_tic: |
      set -eu
      command -v tic >/dev/null 2>&1 && exit 0
      root() { if [ "$(id -u)" = 0 ]; then "$@"; else sudo "$@"; fi; }
      . /etc/os-release
      case " $ID ${ID_LIKE:-} " in
        *' debian '*|*' ubuntu '*) root apt-get update; root env DEBIAN_FRONTEND=noninteractive apt-get install -y ncurses-bin ;;
        *' fedora '*|*' rhel '*|*' rocky '*) root dnf install -y ncurses ;;
        *' suse '*|*' opensuse-tumbleweed '*) root zypper --non-interactive install ncurses-devel ncurses-utils ;;
        *' arch '*) root pacman -S --needed --noconfirm ncurses ;;
        *' alpine '*) root apk add ncurses ;;
        *) echo "No supported tic package installer for $ID" >&2; exit 1 ;;
      esac
      command -v tic >/dev/null
    remote: sh -c %{script}
    script: |
      set -eu
      umask 077
      source=$(mktemp "${TMPDIR:-/tmp}/shui-terminfo.XXXXXX")
      trap 'rm -f "$source"' 0
      trap 'exit 1' HUP INT TERM
      cat > "$source"
      mkdir -p "$HOME/.terminfo"
      tic -x -o "$HOME/.terminfo" "$source"
