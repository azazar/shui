# Native Windows overrides. No local POSIX shell or Git installation required.
profiles:
  - name: SSH
    shell: direct
    available_command: where.exe ssh
    prepare_command: null
    command: ssh -- %h
    port_args: ["-p", "%p"]
  - name: Mosh
    shell: direct
    available_command: powershell.exe -NoProfile -Command 'Get-Command ssh,mosh -CommandType Application -ErrorAction Stop | Out-Null'
    command: mosh -- %h
    port_args: ["--ssh=ssh -p %p"]
  - name: MC
    shell: direct
    available_command: where.exe mc
    prepare_command: null
    command: mc /sh://%t/
    port_args: []
  - name: Bash
    shell: direct
    available_command: where.exe ssh
    prepare_command: null
    command: ssh -tt -- %h %{remote}
    port_args: ["-p", "%p"]
  - name: Zellij
    shell: direct
    available_command: where.exe ssh
    prepare_command: null
    command: ssh -tt -- %h %{remote}
    port_args: ["-p", "%p"]
  - name: Tmux
    shell: direct
    available_command: where.exe ssh
    prepare_command: null
    command: ssh -tt -- %h %{remote}
    port_args: ["-p", "%p"]
  - name: SFTP
    shell: direct
    available_command: where.exe sftp
    prepare_command: null
    command: sftp -- %h
    port_args: ["-P", "%p"]
  - name: Monitor
    shell: direct
    available_command: where.exe ssh
    prepare_command: null
    command: ssh -tt -- %h %{remote}
    port_args: ["-p", "%p"]
  - name: Tunnel
    shell: direct
    available_command: where.exe ssh
    prepare_command: null
    command: ssh -N -T -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -L 127.0.0.1:%{input:forward} -- %h
    port_args: ["-p", "%p"]
  - name: SOCKS
    shell: direct
    available_command: where.exe ssh
    prepare_command: null
    command: ssh -N -T -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -D 127.0.0.1:%{input:port} -- %h
    port_args: ["-p", "%p"]
  - name: Dropbear
    shell: direct
    available_command: where.exe dbclient
    prepare_command: null
    command: dbclient -- %h
    port_args: ["-p", "%p"]
  - name: PuTTY
    shell: direct
    available_command: where.exe putty.exe
    prepare_command: null
    key: Alt+P
    command: putty.exe -ssh %h
    port_args: ["-P", "%p"]
  - name: Plink
    shell: direct
    available_command: where.exe plink.exe
    prepare_command: null
    key: Alt+L
    command: plink.exe -ssh -t %h
    port_args: ["-P", "%p"]

configuration_scripts:
  - name: Configure key-based auth
    prepare_key: null
    setup_script: null
    shell: powershell
    available_command: Get-Command ssh,ssh-keygen -CommandType Application -ErrorAction Stop | Out-Null
    windows: &windows_helpers |
      $ErrorActionPreference = 'Stop'
      function Invoke-Native {
        param([string]$Program, [string[]]$Arguments, [AllowNull()]$InputText = $null, [switch]$Capture)
        $start = [System.Diagnostics.ProcessStartInfo]::new()
        $start.FileName = $Program
        $start.UseShellExecute = $false
        # Quote Windows argv, including quotes and trailing backslashes.
        $start.Arguments = ($Arguments | ForEach-Object {
          '"' + [regex]::Replace([regex]::Replace($_, '(\\*)"', '$1$1\"'), '(\\+)$', '$1$1') + '"'
        }) -join ' '
        $start.RedirectStandardInput = $null -ne $InputText
        $start.RedirectStandardOutput = $Capture
        if ($Capture) { $start.StandardOutputEncoding = [System.Text.UTF8Encoding]::new($false) }
        # Avoid a UTF-8 BOM on SSH stdin from .NET Framework's writer.
        $previousEncoding = [Console]::InputEncoding
        try {
          if ($start.RedirectStandardInput) { [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false) }
          $process = [System.Diagnostics.Process]::Start($start)
        } finally {
          if ($start.RedirectStandardInput) { [Console]::InputEncoding = $previousEncoding }
        }
        try {
          if ($start.RedirectStandardInput) { $bytes = [System.Text.Encoding]::UTF8.GetBytes($InputText); $process.StandardInput.BaseStream.Write($bytes, 0, $bytes.Length); $process.StandardInput.Close() }
          if ($Capture) { $output = $process.StandardOutput.ReadToEnd() }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "$Program exited with status $($process.ExitCode)" }
          if ($Capture) { return $output }
        } finally { $process.Dispose() }
      }
      function Get-KeyPath {
        param([string]$Name, [string]$NewName)
        $directory = Join-Path $env:USERPROFILE '.ssh'
        if ($Name -eq 'Generate new Ed25519 key') {
          if ($NewName -notmatch '^[A-Za-z0-9][A-Za-z0-9_.-]*$') { throw 'Invalid new key filename' }
          $private = Join-Path $directory $NewName
          foreach ($path in @($private, "$private.pub")) {
            if (Get-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue) { throw "Key file already exists: $path" }
          }
          [void][IO.Directory]::CreateDirectory($directory)
          Invoke-Native ssh-keygen @('-q', '-t', 'ed25519', '-f', $private)
          $public = "$private.pub"
        } else {
          if ([IO.Path]::GetFileName($Name) -ne $Name -or !$Name.EndsWith('.pub')) { throw 'Invalid SSH public key filename' }
          $public = Join-Path $directory $Name
        }
        if (!(Test-Path -LiteralPath $public -PathType Leaf) -or !(Test-Path -LiteralPath $public.Substring(0, $public.Length - 4) -PathType Leaf)) {
          throw "Missing SSH keypair: $public"
        }
        return $public
      }
    inputs:
      - &windows_key
        id: key
        type: pickString
        description: SSH keypair
        required: true
        shell: powershell
        command: |
          $directory = [IO.Path]::Combine($env:USERPROFILE, '.ssh')
          $files = @()
          if ([IO.Directory]::Exists($directory)) { $files = [IO.Directory]::GetFiles($directory, 'id_*.pub'); [Array]::Sort($files) }
          [Console]::WriteLine('options:')
          foreach ($public in $files) {
            if (![IO.File]::Exists($public.Substring(0, $public.Length - 4))) { continue }
            $name = [IO.Path]::GetFileName($public).Replace("'", "''")
            [Console]::WriteLine("  - '" + $name + "'")
          }
          [Console]::WriteLine("  - 'Generate new Ed25519 key'")
      - id: new_key
        type: promptString
        description: New key filename in ~/.ssh (generation only)
        default: id_ed25519
        required: true
        pattern: '[A-Za-z0-9][A-Za-z0-9_.-]*'
        validation_message: Use a filename without slashes; choose an unused name
      - &windows_expiry
        id: expiry
        type: pickString
        description: Key expiry
        options: [never, 8 hours, day, week, month, year]
        default: never
    command: . ([scriptblock]::Create(%{windows})); & ([scriptblock]::Create(%{setup_windows})) %h %p %{input:key} %{expiry_remote} %{install_key_remote} %{input:new_key}
    install_key_remote: &install_key_remote sh -c %{install_key}
    install_key: &install_key |
      set -eu
      umask 077
      mkdir -p "$HOME/.ssh"
      file="$HOME/.ssh/authorized_keys"
      test ! -L "$file" || { echo 'Refusing symlinked authorized_keys' >&2; exit 1; }
      test ! -e "$file" || test -f "$file" || exit 1
      touch "$file"
      chmod 600 "$file"
      IFS= read -r key
      key=$(printf '%s' "$key" | tr -d '\r')
      blob=$(printf '%s\n' "$key" | awk '{print $1 " " $2}')
      test -n "$blob" || exit 1
      if ! awk -v key="$blob" 'index($0,key) { found=1 } END { exit !found }' "$file"; then
        printf '\n%s\n' "$key" >> "$file"
      fi
    setup_windows: &setup_windows |
      param($Destination, $Port, $KeyName, $ExpiryRemote, $InstallKeyRemote, $NewKeyName)
      $ErrorActionPreference = 'Stop'
      $public = Get-KeyPath $KeyName $NewKeyName
      $private = $public.Substring(0, $public.Length - 4)
      $key = [IO.File]::ReadAllText($public).Trim() + "`n"
      $connection = @()
      if ($Port) { $connection = @('-p', $Port) }
      Invoke-Native ssh ($connection + @('--', $Destination, $InstallKeyRemote)) -InputText $key
      Invoke-Native ssh ($connection + @('-i', $private, '--', $Destination, $ExpiryRemote)) -InputText $key
  - name: Install dotfiles
    shell: powershell
    available_command: Get-Command ssh,scp -CommandType Application -ErrorAction Stop | Out-Null
    windows: *windows_helpers
    setup_dotfiles: |
      param($Destination, $Port, $Source, $Installer, $Remote)
      $ErrorActionPreference = 'Stop'
      if ($Source -eq '~') { $Source = $env:USERPROFILE }
      elseif ($Source.StartsWith('~/') -or $Source.StartsWith('~\')) { $Source = Join-Path $env:USERPROFILE $Source.Substring(2) }
      if (![IO.Path]::IsPathRooted($Source)) { $Source = Join-Path $env:USERPROFILE $Source }
      if (!(Test-Path -LiteralPath (Join-Path $Source $Installer) -PathType Leaf)) { throw "Missing installer: $Source/$Installer" }
      $connection = @()
      if ($Port) { $connection = @('-p', $Port) }
      Invoke-Native ssh ($connection + @('--', $Destination, 'mkdir -p "$HOME/src/dotfiles"'))
      $copy = @()
      if ($Port) { $copy = @('-P', $Port) }
      Invoke-Native scp ($copy + @('-r', (Join-Path $Source '.'), ($Destination + ':src/dotfiles/')))
      Invoke-Native ssh ($connection + @('-tt', '--', $Destination, $Remote))
    inputs:
      - id: source
        type: promptString
        description: Local directory (absolute or relative to user profile)
        default: ~/src/dotfiles
        required: true
      - id: installer
        type: promptString
        description: Installer path relative to dotfiles directory
        default: install.sh
        required: true
      - id: shell
        type: pickString
        description: Installer shell
        options: [sh, bash]
        default: sh
    command: . ([scriptblock]::Create(%{windows})); & ([scriptblock]::Create(%{setup_dotfiles})) %h %p %{input:source} %{input:installer} %{remote}
  - name: Configure passwordless sudo
    shell: direct
    command: ssh -tt -- %h %{remote}
    port_args: [-p, '%p']
  - name: Configure SSH-agent sudo
    shell: direct
    command: ssh -A -tt -- %h %{remote}
    port_args: [-p, '%p']
  - name: Configure automatic security updates
    shell: direct
    command: ssh -tt -- %h %{remote}
    port_args: [-p, '%p']
  - name: Install Docker / Podman
    shell: direct
    command: ssh -tt -- %h %{remote}
    port_args: [-p, '%p']
  - name: Configure log limits and cleanup
    shell: direct
    command: ssh -tt -- %h %{remote}
    port_args: [-p, '%p']
  - name: Configure firewall
    shell: direct
    command: ssh -tt -- %h %{remote}
    port_args: [-p, '%p']
  - name: Copy terminal definition
    export_script: null
    shell: powershell
    available_command: if ((Get-Command ssh,infocmp -CommandType Application -ErrorAction SilentlyContinue).Count -eq 2 -and $env:TERM) { exit 0 } else { exit 1 }
    windows: *windows_helpers
    command: . ([scriptblock]::Create(%{windows})); $definition = Invoke-Native infocmp @('-x', '--', $env:TERM) -Capture; $port = %p; $connection = @(); if ($port) { $connection = @('-p', $port) }; Invoke-Native ssh ($connection + @('-tt', '--', %h, %{ensure_remote})); Invoke-Native ssh ($connection + @('--', %h, %{remote})) -InputText $definition
